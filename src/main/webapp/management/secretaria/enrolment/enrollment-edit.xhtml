<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <p:dialog id="editEnrollmentDialog" widgetVar="editEnrollmentDialog" header="#{msg.editEnrollment}" modal="true"
        showEffect="fade" hideEffect="fade" closeOnEscape="true" style="width: 90vw; max-width: 900px;"
        dynamic="true" resizable="false" appendTo="@(body)" styleClass="sc-dialog-edit" responsive="true"
        fitViewport="true">

        <h:form id="enrollmentEditForm" styleClass="ui-fluid" enctype="multipart/form-data">
            <p:messages id="msgsEdit" showDetail="true" closable="true" globalOnly="true" />

            <div style="padding: .5rem 0 1rem;">
                <div style="font-size:1rem; font-weight:700; margin-bottom:1rem; display:flex; align-items:center; gap:.5rem;">
                    <i class="pi pi-id-card" style="color:var(--enr-red, #c8102e);"></i> #{msg.enrollmentData}
                </div>

                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank"
                    columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">
                    <p:outputLabel for="editEnrollmentNumber" value="#{msg.enrollmentNumber}" styleClass="sc-label" />
                    <p:inputText id="editEnrollmentNumber" value="#{enrolmentController.editDto.enrolmentNumber}"
                        readonly="true" styleClass="sc-readonly-field" style="background:#f3f4f6;" />

                    <p:outputLabel for="editStudent" value="#{msg.selectStudent}" styleClass="sc-label req" />
                    <p:selectOneMenu id="editStudent" value="#{enrolmentController.selectedStudentId}" required="true"
                        requiredMessage="#{msg.requiredStudent}" filter="true" filterMatchMode="contains" style="width:100%;">
                        <f:selectItem itemLabel="#{msg.selectOption}" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{enrolmentController.students}" var="st"
                            itemLabel="#{st.fullName} (#{st.sudentNumber})" itemValue="#{st.pkStudent}" />
                    </p:selectOneMenu>

                    <p:outputLabel for="editSchoolClass" value="#{msg.selectSchoolClass}" styleClass="sc-label req" />
                    <p:selectOneMenu id="editSchoolClass" value="#{enrolmentController.selectedSchoolClassId}" required="true"
                        requiredMessage="#{msg.requiredSchoolClass}" filter="true" filterMatchMode="contains" style="width:100%;">
                        <f:selectItem itemLabel="#{msg.selectOption}" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{enrolmentController.schoolClasses}" var="sc"
                            itemLabel="#{sc.classCode} — #{sc.className}" itemValue="#{sc.pkSchoolClass}" />
                    </p:selectOneMenu>

                    <p:outputLabel for="editShift" value="#{msg.selectShift}" styleClass="sc-label req" />
                    <p:selectOneMenu id="editShift" value="#{enrolmentController.editDto.shift}" required="true"
                        requiredMessage="#{msg.requiredShift}" style="width:100%;">
                        <f:selectItem itemLabel="#{msg.selectOption}" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{enrolmentController.shifts}" var="sh" itemLabel="#{msg[sh]}" itemValue="#{sh}" />
                    </p:selectOneMenu>

                    <p:outputLabel for="editEnrolmentType" value="#{msg.enrollmentTypeLabel}" styleClass="sc-label req" />
                    <p:selectOneMenu id="editEnrolmentType" value="#{enrolmentController.editDto.enrolmentType}" required="true"
                        requiredMessage="#{msg.requiredType}" style="width:100%;">
                        <f:selectItem itemLabel="#{msg.selectOption}" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{enrolmentController.enrolmentTypes}" var="et" itemLabel="#{msg[et]}" itemValue="#{et}" />
                    </p:selectOneMenu>

                    <p:outputLabel for="editEnrolmentData" value="#{msg.enrollmentDate}" styleClass="sc-label" />
                    <p:datePicker id="editEnrolmentData" value="#{enrolmentController.editDto.enrolmentData}"
                        pattern="dd/MM/yyyy" showIcon="true" locale="pt" monthNavigator="true" yearNavigator="true"
                        yearRange="2020:2030" style="width:100%;" />
                </p:panelGrid>

                <div style="margin-top:1.2rem;">
                    <p:outputLabel for="editNotes" value="#{msg.observations}" styleClass="sc-label" />
                    <p:inputTextarea id="editNotes" value="#{enrolmentController.editDto.obs}" rows="3" maxlength="500"
                        counter="notesCounterEdit" counterTemplate="{0} / 500"
                        placeholder="#{msg.additionalNotesPlaceholder}" autoResize="true" style="width:100%;" />
                    <h:outputText id="notesCounterEdit" style="display:block; text-align:right; font-size:11px; color:#888; margin-top:2px;" />
                </div>

            </div>

            <div style="display:flex; justify-content:flex-end; gap:.6rem; padding-top:1rem; border-top:1px solid #e5e7eb; flex-wrap: wrap;">
                <p:commandButton value="#{msg.cancel}" icon="pi pi-times" type="button"
                    onclick="PF('editEnrollmentDialog').hide()" styleClass="ui-button-outlined ui-button-secondary" />
                <p:commandButton value="#{msg.save}" icon="pi pi-save" styleClass="ui-button-success"
                    action="#{enrolmentController.saveUpdate}" process="@form"
                    update=":enrollmentEditForm:msgsEdit :formEnrollments:dtEnrollments :formEnrollments:messages"
                    onstart="showScLoading()"
                    oncomplete="hideScLoading(); if (!args.validationFailed) { PF('editEnrollmentDialog').hide(); }" />
            </div>
        </h:form>
    </p:dialog>

    <style>
        /* ===== DESKTOP / TABLET — margens em todos os lados ===== */
        @media (min-width: 768px) {
            .sc-dialog-edit .ui-dialog {
                top: 1rem !important;
                left: 1rem !important;
                right: 1rem !important;
                bottom: 1rem !important;
                width: auto !important;
                height: auto !important;
                max-width: 900px !important;
                margin: 0 auto !important;
                border-radius: 12px !important;
            }
            .sc-dialog-edit .ui-dialog-content {
                height: calc(100vh - 180px) !important;
                max-height: calc(100vh - 180px) !important;
                overflow-y: auto !important;
            }
        }

        /* ===== MOBILE — margens em todos os lados ===== */
        @media (max-width: 767px) {
            .sc-dialog-edit .ui-dialog {
                top: 1rem !important;
                left: 1rem !important;
                right: 1rem !important;
                bottom: 1rem !important;
                width: auto !important;
                height: auto !important;
                max-width: none !important;
                margin: 0 !important;
                border-radius: 12px !important;
            }
            .sc-dialog-edit .ui-dialog-content {
                max-height: calc(100vh - 180px) !important;
                overflow-y: auto !important;
            }
        }

        .sc-label {
            font-size: .88rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: .3rem;
            display: block;
        }

        .sc-label.req::after {
            content: " *";
            color: #dc2626;
        }

        .sc-field-msg {
            display: block;
            margin-top: 4px;
            font-size: 12px;
            color: #dc2626;
        }

        .sc-readonly-field {
            opacity: .8;
            cursor: not-allowed;
        }

        .photo-preview-wrap {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: .3rem;
        }

        .photo-preview {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #f3f4f6;
            border: 2px dashed #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-preview .pi {
            font-size: 1.3rem;
            color: #9ca3af;
        }

        .photo-info {
            font-size: .75rem;
            color: #6b7280;
        }

        @media (max-width: 576px) {
            .sc-dialog-edit .ui-dialog-content {
                padding: .5rem !important;
            }

            .photo-preview-wrap {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</ui:composition>
