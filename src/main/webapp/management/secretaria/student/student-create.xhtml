<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <p:dialog id="createStudentDialog" widgetVar="createStudentDialog" header="#{msg.newStudent}" modal="true"
        showEffect="fade" hideEffect="fade" closeOnEscape="true" style="width: 90vw; max-width: 860px;" dynamic="true"
        resizable="false" appendTo="@(body)" styleClass="sc-dialog-create-student" responsive="true" fitViewport="true">

        <h:form id="studentCreateForm" styleClass="ui-fluid" enctype="multipart/form-data">
            <p:messages id="msgsCreate" showDetail="true" closable="true" globalOnly="true" />

            <div class="sc-dialog-body">

                <div class="sc-section-title">
                    <i class="pi pi-id-card"></i> #{msg.identification}
                </div>

                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank"
                    columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">

                    <p:outputLabel for="studentNumberCreate" value="#{msg.studentNumber}" styleClass="sc-label" />
                    <p:inputText id="studentNumberCreate" value="#{studentController.student.sudentNumber}"
                        readonly="true" styleClass="sc-input sc-readonly-field" placeholder="#{msg.autoGenerated}" />

                    <p:outputLabel for="fristNameCreate" value="#{msg.firstName}" styleClass="sc-label req" />
                    <h:panelGroup>
                        <p:inputText id="fristNameCreate" value="#{studentController.student.fristName}"
                            required="true" requiredMessage="#{msg.firstNameRequired}" styleClass="sc-input" />
                        <p:message for="fristNameCreate" display="text" styleClass="sc-field-msg" />
                    </h:panelGroup>

                    <p:outputLabel for="lastNameCreate" value="#{msg.lastName}" styleClass="sc-label req" />
                    <h:panelGroup>
                        <p:inputText id="lastNameCreate" value="#{studentController.student.lastName}"
                            required="true" requiredMessage="#{msg.lastNameRequired}" styleClass="sc-input" />
                        <p:message for="lastNameCreate" display="text" styleClass="sc-field-msg" />
                    </h:panelGroup>

                    <p:outputLabel for="genderCreate" value="#{msg.gender}" styleClass="sc-label req" />
                    <h:panelGroup>
                        <p:selectOneMenu id="genderCreate" value="#{studentController.student.gender}"
                            required="true" requiredMessage="#{msg.genderRequired}" style="width:100%;">
                            <f:selectItem itemLabel="&#8212; #{msg.select} &#8212;" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{studentController.genders}" var="g" itemLabel="#{msg['gender.'.concat(g.name())]}" itemValue="#{g}" />
                        </p:selectOneMenu>
                        <p:message for="genderCreate" display="text" styleClass="sc-field-msg" />
                    </h:panelGroup>

                    <p:outputLabel for="nascDateCreate" value="#{msg.birthDate}" styleClass="sc-label" />
                    <p:datePicker id="nascDateCreate" value="#{studentController.student.nascDate}"
                        pattern="dd/MM/yyyy" showIcon="true" locale="pt" style="width:100%;" />

                    <p:outputLabel for="statusCreate" value="#{msg.status}" styleClass="sc-label" />
                    <p:selectOneMenu id="statusCreate" value="#{studentController.student.status}" style="width:100%;">
                        <f:selectItem itemLabel="&#8212; #{msg.select} &#8212;" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{studentController.studentStatuses}" var="st" itemLabel="#{msg['studentStatus.'.concat(st.name())]}" itemValue="#{st}" />
                    </p:selectOneMenu>

                </p:panelGrid>

                <div class="sc-section-title" style="margin-top:1.4rem;">
                    <i class="pi pi-shield"></i> #{msg.documentAndPhoto}
                </div>

                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank"
                    columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">

                    <p:outputLabel for="biNumberCreate" value="#{msg.biNumber}" styleClass="sc-label req" />
                    <h:panelGroup>
                        <p:inputText id="biNumberCreate" value="#{studentController.student.biNumber}"
                            required="true" requiredMessage="#{msg.biNumberRequired}" styleClass="sc-input"
                            placeholder="123456789LA042">
                            <p:ajax event="blur" listener="#{studentController.validarBI}" update="msgsCreate" process="@this" />
                        </p:inputText>
                        <p:message for="biNumberCreate" display="text" styleClass="sc-field-msg" />
                    </h:panelGroup>

                    <p:outputLabel for="biExpiryDataCreate" value="#{msg.biExpiryDate}" styleClass="sc-label" />
                    <p:datePicker id="biExpiryDataCreate" value="#{studentController.student.biExpiryData}"
                        pattern="dd/MM/yyyy" showIcon="true" locale="pt" style="width:100%;" />

                    <p:outputLabel for="photoCreate" value="#{msg.photo}" styleClass="sc-label" />
                    <p:fileUpload id="photoCreate" value="#{studentController.uploadedPhoto}"
                        mode="simple" skinSimple="true" label="#{msg.choosePhoto}"
                        allowTypes="/(\.|\/)(jpe?g|png|webp)$/i" style="width:100%;" />

                </p:panelGrid>

                <div class="sc-section-title" style="margin-top:1.4rem;">
                    <i class="pi pi-map-marker"></i> #{msg.addressAndFamily}
                </div>

                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank"
                    columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">

                    <p:outputLabel for="addressStreetCreate" value="#{msg.street}" styleClass="sc-label" />
                    <p:inputText id="addressStreetCreate" value="#{studentController.student.addressStreet}" styleClass="sc-input" />

                    <p:outputLabel for="addressProviceCreate" value="#{msg.province}" styleClass="sc-label" />
                    <p:inputText id="addressProviceCreate" value="#{studentController.student.addressProvice}" styleClass="sc-input" />

                    <p:outputLabel for="nameFatherCreate" value="#{msg.father}" styleClass="sc-label" />
                    <p:inputText id="nameFatherCreate" value="#{studentController.student.nameFather}" styleClass="sc-input" />

                    <p:outputLabel for="nameMatherCreate" value="#{msg.mother}" styleClass="sc-label" />
                    <p:inputText id="nameMatherCreate" value="#{studentController.student.nameMather}" styleClass="sc-input" />

                </p:panelGrid>

                <div class="sc-section-title" style="margin-top:1.4rem;">
                    <i class="pi pi-phone"></i> #{msg.contacts}
                </div>

                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank"
                    columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">

                    <p:outputLabel for="emailCreate" value="#{msg.email}" styleClass="sc-label" />
                    <h:panelGroup>
                        <p:inputText id="emailCreate" value="#{studentController.student.email}" styleClass="sc-input">
                            <f:validator validatorId="jakarta.faces.Email" disabled="#{empty studentController.student.email}" />
                        </p:inputText>
                        <p:message for="emailCreate" display="text" styleClass="sc-field-msg" />
                    </h:panelGroup>

                    <p:outputLabel for="phone1Create" value="#{msg.phone}" styleClass="sc-label req" />
                    <h:panelGroup>
                        <p:inputText id="phone1Create" value="#{studentController.student.phone_1}"
                            required="true" requiredMessage="#{msg.phoneRequired}" styleClass="sc-input" />
                        <p:message for="phone1Create" display="text" styleClass="sc-field-msg" />
                    </h:panelGroup>

                    <p:outputLabel for="phone2Create" value="#{msg.alternatePhone}" styleClass="sc-label" />
                    <p:inputText id="phone2Create" value="#{studentController.student.phone_2}" styleClass="sc-input" />

                </p:panelGrid>

                <div class="sc-fullwidth-field">
                    <p:outputLabel for="obsCreate" value="#{msg.observation}" styleClass="sc-label" />
                    <p:inputTextarea id="obsCreate" value="#{studentController.student.obs}" rows="3"
                        maxlength="500" counter="obsCounterCreate" counterTemplate="{0} / 500"
                        placeholder="#{msg.additionalNotesPlaceholder}" style="width:100%;" />
                    <h:outputText id="obsCounterCreate" styleClass="sc-counter" />
                </div>
            </div>

            <div class="sc-dialog-footer">
                <p:commandButton value="#{msg.cancel}" icon="pi pi-times" type="button"
                    onclick="PF('createStudentDialog').hide()" styleClass="ui-button-outlined ui-button-secondary" />
                
                <!-- ajax="false" obrigatório para p:fileUpload mode="simple" -->
                <p:commandButton value="#{msg.save}" icon="pi pi-save" styleClass="ui-button-success"
                    action="#{studentController.saveStudent}" ajax="false" />
            </div>
        </h:form>

        <style type="text/css">
            /* <![CDATA[ */
            .sc-dialog-create-student .ui-dialog-content {
                padding: 0 !important;
            }
            .sc-dialog-body {
                padding: 1.2rem 1.5rem 1rem;
                max-height: calc(90vh - 120px);
                overflow-y: auto;
            }
            .sc-section-title {
                font-size: 1rem;
                font-weight: 700;
                margin-bottom: 1rem;
                display: flex;
                align-items: center;
                gap: .5rem;
                color: var(--enr-text, #141414);
            }
            .sc-section-title i {
                color: var(--enr-red, #c8102e);
            }
            .sc-label {
                font-size: .88rem;
                font-weight: 600;
                color: #374151;
                margin-bottom: .35rem;
                display: block;
            }
            .sc-label.req::after {
                content: " *";
                color: #dc2626;
            }
            .sc-field-msg {
                display: block;
                margin-top: 4px;
                font-size: 12px;
                color: #dc2626;
            }
            .sc-input {
                width: 100%;
            }
            .sc-readonly-field {
                background: #f3f4f6 !important;
                opacity: .8;
                cursor: not-allowed;
            }
            .sc-fullwidth-field {
                margin-top: 1.2rem;
            }
            .sc-counter {
                display: block;
                text-align: right;
                font-size: 11px;
                color: #888;
                margin-top: 2px;
            }
            .sc-dialog-footer {
                display: flex;
                justify-content: flex-end;
                gap: .6rem;
                padding: 1rem 1.5rem;
                border-top: 1px solid #e5e7eb;
                flex-wrap: wrap;
                background: #fafafa;
                border-radius: 0 0 12px 12px;
            }
            .sc-dialog-footer .ui-button {
                min-width: 120px;
            }

            .sc-dialog-body::-webkit-scrollbar { width: 5px; }
            .sc-dialog-body::-webkit-scrollbar-track { background: transparent; }
            .sc-dialog-body::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 99px; }

            @media (max-width: 768px) {
                .sc-dialog-create-student {
                    width: 95vw !important;
                    max-width: 95vw !important;
                }
                .sc-dialog-create-student .ui-dialog-content {
                    padding: 0 !important;
                }
                .sc-dialog-body {
                    padding: 1rem;
                    max-height: calc(85vh - 100px);
                }
                .sc-dialog-footer {
                    padding: .8rem 1rem;
                    flex-direction: column;
                    gap: .5rem;
                }
                .sc-dialog-footer .ui-button {
                    width: 100%;
                    min-width: unset;
                }
                .sc-section-title { font-size: .95rem; }
                .sc-label { font-size: .85rem; }
            }
            @media (max-width: 576px) {
                .sc-dialog-body { padding: .8rem; }
                .sc-fullwidth-field { margin-top: 1rem; }
            }
            /* ]]> */
        </style>
    </p:dialog>

</ui:composition>
