<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <p:dialog id="createStudentDialog" widgetVar="createStudentDialog" header="#{msg.newStudent}" modal="true"
        showEffect="fade" hideEffect="fade" closeOnEscape="true" styleClass="st-dialog-create"
        dynamic="true" resizable="false" appendTo="@(body)" responsive="true" fitViewport="true">

        <h:form id="studentCreateForm" styleClass="ui-fluid">
            <p:messages id="msgsCreate" showDetail="true" closable="true" globalOnly="true" />

            <div class="st-dialog-body">

                <!-- ====================================================
                     SECCAO 1 – IDENTIFICACAO
                     ==================================================== -->
                <div class="st-section">
                    <div class="st-section-title"><i class="pi pi-id-card"></i> #{msg.identification}</div>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank"
                        columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">

                        <p:outputLabel for="sudentNumber" value="#{msg.studentNumber}" styleClass="st-label" />
                        <!--
                            p:inputGroup foi removido a partir do PrimeFaces 10+.
                            O agrupamento de inputs passa a fazer-se com uma div/span
                            com a classe CSS "p-inputgroup" — nao e um componente.
                        -->
                        <div class="p-inputgroup">
                            <p:inputText id="sudentNumber" value="#{studentController.novoAluno.sudentNumber}"
                                placeholder="ALU-00001" style="width:100%;" />
                            <p:commandButton icon="pi pi-refresh" title="#{msg.generateAutomatically}"
                                actionListener="#{studentController.gerarNumeroAluno}" process="@this"
                                update="sudentNumber" styleClass="p-inputgroup-addon" />
                        </div>

                        <p:outputLabel for="fristName" value="#{msg.firstName}" styleClass="st-label req" />
                        <h:panelGroup>
                            <p:inputText id="fristName" value="#{studentController.novoAluno.fristName}" required="true" style="width:100%;" />
                            <p:message for="fristName" display="text" styleClass="st-field-msg" />
                        </h:panelGroup>

                        <p:outputLabel for="lastName" value="#{msg.lastName}" styleClass="st-label req" />
                        <h:panelGroup>
                            <p:inputText id="lastName" value="#{studentController.novoAluno.lastName}" required="true" style="width:100%;" />
                            <p:message for="lastName" display="text" styleClass="st-field-msg" />
                        </h:panelGroup>

                        <p:outputLabel for="gender" value="#{msg.gender}" styleClass="st-label" />
                        <p:selectOneMenu id="gender" value="#{studentController.novoAluno.gender}" style="width:100%;">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{studentController.generos}" var="g" itemLabel="#{g}"
                                itemValue="#{g}" />
                        </p:selectOneMenu>

                        <p:outputLabel for="nascDate" value="#{msg.birthDate}" styleClass="st-label" />
                        <p:datePicker id="nascDate" value="#{studentController.novoAluno.nascDate}" pattern="dd/MM/yyyy"
                            showIcon="true" monthNavigator="true" yearNavigator="true" yearRange="1950:2030" locale="pt" style="width:100%;" />

                        <p:outputLabel for="biNumber" value="#{msg.biNumber}" styleClass="st-label" />
                        <p:inputText id="biNumber" value="#{studentController.novoAluno.biNumber}"
                            placeholder="123456789LA041" style="width:100%;">
                            <p:ajax event="blur" listener="#{studentController.validarBI}" update="msgsCreate"
                                process="@this" />
                        </p:inputText>

                        <p:outputLabel for="biExpiryData" value="#{msg.biExpiryDate}" styleClass="st-label" />
                        <p:datePicker id="biExpiryData" value="#{studentController.novoAluno.biExpiryData}"
                            pattern="dd/MM/yyyy" showIcon="true" monthNavigator="true" yearNavigator="true" yearRange="2020:2050" locale="pt" style="width:100%;" />

                        <p:outputLabel for="status" value="#{msg.status}" styleClass="st-label" />
                        <p:selectOneMenu id="status" value="#{studentController.novoAluno.status}" style="width:100%;">
                            <f:selectItems value="#{studentController.estados}" var="s" itemLabel="#{s}"
                                itemValue="#{s}" />
                        </p:selectOneMenu>

                    </p:panelGrid>
                </div>

                <!-- ====================================================
                     SECCAO 2 – MORADA
                     ==================================================== -->
                <div class="st-section">
                    <div class="st-section-title"><i class="pi pi-map-marker"></i> #{msg.address}</div>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank"
                        columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">

                        <p:outputLabel for="addressStreet" value="#{msg.street}" styleClass="st-label" />
                        <p:inputText id="addressStreet" value="#{studentController.novoAluno.addressStreet}" style="width:100%;" />

                        <p:outputLabel for="addressProvice" value="#{msg.province}" styleClass="st-label" />
                        <p:inputText id="addressProvice" value="#{studentController.novoAluno.addressProvice}" style="width:100%;" />

                    </p:panelGrid>
                </div>

                <!-- ====================================================
                     SECCAO 3 – ENCARREGADOS
                     ==================================================== -->
                <div class="st-section">
                    <div class="st-section-title"><i class="pi pi-users"></i> #{msg.guardians}</div>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank"
                        columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">

                        <p:outputLabel for="nameFather" value="#{msg.fatherName}" styleClass="st-label" />
                        <p:inputText id="nameFather" value="#{studentController.novoAluno.nameFather}" style="width:100%;" />

                        <p:outputLabel for="nameMather" value="#{msg.motherName}" styleClass="st-label" />
                        <p:inputText id="nameMather" value="#{studentController.novoAluno.nameMather}" style="width:100%;" />

                        <p:outputLabel for="email" value="#{msg.email}" styleClass="st-label" />
                        <p:inputText id="email" value="#{studentController.novoAluno.email}" style="width:100%;">
                            <f:validateRegex pattern="^[\w.+-]+@[\w-]+\.[a-zA-Z]{2,}$" />
                            <p:ajax event="blur" listener="#{studentController.validarEmail}" update="msgsCreate"
                                process="@this" />
                        </p:inputText>

                        <p:outputLabel for="phone1" value="#{msg.phone1}" styleClass="st-label" />
                        <p:inputText id="phone1" value="#{studentController.novoAluno.phone_1}" style="width:100%;" />

                        <p:outputLabel for="phone2" value="#{msg.phone2}" styleClass="st-label" />
                        <p:inputText id="phone2" value="#{studentController.novoAluno.phone_2}" style="width:100%;" />

                    </p:panelGrid>
                </div>

                <!-- ====================================================
                     SECCAO 4 – FOTO (acima das observacoes)
                     ==================================================== -->
                <div class="st-section">
                    <div class="st-section-title"><i class="pi pi-image"></i> #{msg.photo}</div>
                    <!--
                        MyFaces 4.1 + PrimeFaces 15: atribuir um literal numerico diretamente a
                        sizeLimit dispara IllegalArgumentException ("Component property sizeLimit
                        is not writable"), porque o MyFaces tenta setSizeLimit(...) por reflexao
                        em vez de guardar o valor no mapa de atributos do componente.
                        Envolver o valor em #{...} forca-o a ser tratado como value expression,
                        contornando esse caminho de reflexao.
                    -->
                    <p:fileUpload id="foto" mode="advanced" auto="true" dragDropSupport="true"
                        listener="#{studentController.handleFileUpload}" update="msgsCreate"
                        allowTypes="/(\.|\/)(gif|jpe?g|png)$/" sizeLimit="#{2097152}" label="#{msg.choose}"
                        uploadLabel="#{msg.upload}" cancelLabel="#{msg.cancel}"
                        invalidFileMessage="#{msg.invalidImageFile}" invalidSizeMessage="#{msg.fileTooLarge}" />
                </div>

                <!-- ====================================================
                     SECCAO 5 – OBSERVACOES
                     ==================================================== -->
                <div class="st-section">
                    <div class="st-section-title"><i class="pi pi-file-edit"></i> #{msg.observations}</div>
                    <p:inputTextarea id="obs" value="#{studentController.novoAluno.obs}" rows="3"
                        autoResize="false" style="width:100%;" />
                </div>
            </div>

            <!-- ========================================================
                 FOOTER
                 ======================================================== -->
            <div class="st-dialog-footer">
                <p:commandButton value="#{msg.cancel}" icon="pi pi-times" type="button"
                    onclick="PF('createStudentDialog').hide()" styleClass="ui-button-outlined ui-button-secondary" />

                <p:commandButton value="#{msg.save}" icon="pi pi-save" styleClass="ui-button-success"
                    actionListener="#{studentController.salvar}" process="@form"
                    update=":studentCreateForm:msgsCreate :formAlunos:dtAlunos :formAlunos:growl"
                    oncomplete="if (!args.validationFailed) { PF('createStudentDialog').hide(); }" />
            </div>
        </h:form>
    </p:dialog>

    <style type="text/css">
        /* ============================================================
           VARIAVEIS
           ============================================================ */
        :root {
            --st-primary: #c8102e;
            --st-text-main: #374151;
            --st-border: #e5e7eb;
            --st-bg-body: #f9fafb;
        }

        /* ============================================================
           DIALOG – ALTURA TOTAL DO VIEWPORT
           ============================================================ */
        .st-dialog-create .ui-dialog {
            display: flex !important;
            flex-direction: column !important;
            margin: 0 auto !important;
            border-radius: 8px !important;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04) !important;
        }

        .st-dialog-create .ui-dialog-titlebar {
            background: #fff !important;
            border-bottom: 1px solid var(--st-border) !important;
            padding: 1rem 1.25rem !important;
            font-size: 1.1rem !important;
            font-weight: 700 !important;
            color: var(--st-text-main) !important;
        }

        .st-dialog-create .ui-dialog-content {
            background: var(--st-bg-body) !important;
            padding: 0 !important;
            flex: 1 1 auto !important;
            overflow: hidden !important;
            display: flex !important;
            flex-direction: column !important;
        }

        /* ============================================================
           CORPO COM SCROLL INTERNO
           ============================================================ */
        .st-dialog-body {
            flex: 1 1 auto !important;
            overflow-y: auto !important;
            padding: 1rem 1.25rem !important;
        }

        /* ============================================================
           SECCOES
           ============================================================ */
        .st-section {
            background: #fff;
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin-bottom: 1rem;
            border: 1px solid var(--st-border);
        }

        .st-section:last-child {
            margin-bottom: 0;
        }

        .st-section-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--st-text-main);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--st-border);
        }

        .st-section-title i {
            color: var(--st-primary);
            font-size: 1.1rem;
        }

        /* ============================================================
           LABELS
           ============================================================ */
        .st-label {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--st-text-main);
            margin-bottom: 0.35rem;
            display: block;
        }

        .st-label.req::after {
            content: " *";
            color: #dc2626;
        }

        /* ============================================================
           MENSAGENS DE VALIDACAO
           ============================================================ */
        .st-field-msg {
            display: block;
            margin-top: 4px;
            font-size: 0.8rem;
        }

        .st-field-msg.ui-message-error {
            color: #dc2626;
        }

        /* ============================================================
           INPUTS
           ============================================================ */
        .st-dialog-create .ui-inputfield,
        .st-dialog-create .ui-selectonemenu,
        .st-dialog-create .p-inputgroup .ui-inputfield {
            width: 100% !important;
        }

        /* ============================================================
           FILE UPLOAD
           ============================================================ */
        .st-dialog-create .ui-fileupload {
            border: 2px dashed var(--st-border);
            border-radius: 8px;
            background: #fff;
        }

        .st-dialog-create .ui-fileupload-content {
            border: none;
            background: transparent;
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .st-dialog-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.6rem;
            padding: 1rem 1.25rem;
            background: #fff;
            border-top: 1px solid var(--st-border);
            flex-wrap: wrap;
        }

        /* ============================================================
           RESPONSIVO – DESKTOP (min 1024 px)
           ============================================================ */
        @media (min-width: 1024px) {
            .st-dialog-create .ui-dialog {
                top: 1.5rem !important;
                left: 1.5rem !important;
                right: 1.5rem !important;
                bottom: 1.5rem !important;
                width: auto !important;
                height: auto !important;
                max-width: 960px !important;
                max-height: calc(100vh - 3rem) !important;
            }

            .st-dialog-body {
                max-height: calc(100vh - 200px) !important;
            }
        }

        /* ============================================================
           RESPONSIVO – TABLET (768 a 1023 px)
           ============================================================ */
        @media (min-width: 768px) and (max-width: 1023px) {
            .st-dialog-create .ui-dialog {
                top: 1rem !important;
                left: 1rem !important;
                right: 1rem !important;
                bottom: 1rem !important;
                width: auto !important;
                height: auto !important;
                max-width: 900px !important;
                max-height: calc(100vh - 2rem) !important;
            }

            .st-dialog-body {
                max-height: calc(100vh - 180px) !important;
            }
        }

        /* ============================================================
           RESPONSIVO – MOBILE (max 767 px)
           ============================================================ */
        @media (max-width: 767px) {
            .st-dialog-create .ui-dialog {
                top: 0.5rem !important;
                left: 0.5rem !important;
                right: 0.5rem !important;
                bottom: 0.5rem !important;
                width: auto !important;
                height: auto !important;
                max-width: none !important;
                max-height: calc(100vh - 1rem) !important;
                margin: 0 !important;
                border-radius: 6px !important;
            }

            .st-dialog-body {
                padding: 0.75rem !important;
                max-height: calc(100vh - 150px) !important;
            }

            .st-section {
                padding: 0.75rem;
            }

            .st-dialog-footer {
                padding: 0.75rem;
                gap: 0.5rem;
            }

            .st-dialog-footer .ui-button {
                flex: 1 1 auto;
                min-width: 0;
            }
        }

        /* ============================================================
           RESPONSIVO – MOBILE PEQUENO (max 576 px)
           ============================================================ */
        @media (max-width: 576px) {
            .st-dialog-create .ui-dialog {
                top: 0.25rem !important;
                left: 0.25rem !important;
                right: 0.25rem !important;
                bottom: 0.25rem !important;
                max-height: calc(100vh - 0.5rem) !important;
                border-radius: 4px !important;
            }

            .st-dialog-body {
                padding: 0.5rem !important;
                max-height: calc(100vh - 140px) !important;
            }

            .st-section {
                padding: 0.6rem;
                margin-bottom: 0.6rem;
            }

            .st-section-title {
                font-size: 0.9rem;
                margin-bottom: 0.75rem;
            }

            .st-label {
                font-size: 0.85rem;
            }

            .st-dialog-footer {
                flex-direction: column-reverse;
                padding: 0.6rem;
            }

            .st-dialog-footer .ui-button {
                width: 100%;
            }
        }
    </style>

</ui:composition>
