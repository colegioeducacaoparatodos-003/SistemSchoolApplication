<ui:fragment xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui"
    xmlns:f="http://xmlns.jcp.org/jsf/core">

    <style>
        /* ============ Dialog ============ */
        .add-document-dialog {
            width: 34rem !important;
            max-width: 95vw;
        }
        .add-document-dialog .ui-dialog-titlebar {
            border: 0 none;
            background: transparent;
            padding: 1.5rem 1.6rem 0;
        }
        .add-document-dialog .ui-dialog-content {
            padding: 1.2rem 1.6rem 1.6rem !important;
        }

        /* ============ Cabeçalho ============ */
        .dlg-header {
            display: flex;
            gap: .9rem;
            align-items: center;
        }
        .dlg-header-icon {
            width: 2.7rem;
            height: 2.7rem;
            border-radius: 12px;
            background: #eef2ff;
            color: #4f46e5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            flex-shrink: 0;
        }
        .dlg-title-text h2 {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 700;
            color: #111827;
        }
        .dlg-title-text p {
            margin: .1rem 0 0;
            font-size: .8rem;
            color: #6b7280;
        }

        /* ============ Campos ============ */
        .field-block { margin-bottom: 1.1rem; }
        .field-label {
            display: block;
            font-size: .76rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: .4rem;
            text-transform: uppercase;
            letter-spacing: .03em;
        }
        .field-block .ui-inputtext,
        .field-block .ui-selectonemenu {
            width: 100%;
            border-radius: 10px;
            padding: .6rem .8rem;
        }
        .field-block .ui-selectonemenu .ui-selectonemenu-label { padding: .6rem .8rem; }

        /* ============ Zona de upload ============ */
        .upload-dropzone {
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            padding: 1.2rem 1rem 1rem;
            text-align: center;
            background: #fafafa;
            transition: border-color .2s, background .2s;
        }
        .upload-dropzone:hover {
            border-color: #4f46e5;
            background: #f5f7ff;
        }
        .upload-dropzone .ui-fileupload-simple {
            display: flex;
            justify-content: center;
        }
        .upload-dropzone .ui-fileupload .ui-button {
            background: #4f46e5;
            border-color: #4f46e5;
            border-radius: 10px;
            font-weight: 600;
        }
        .upload-dropzone .ui-fileupload .ui-button:hover {
            background: #4338ca;
            border-color: #4338ca;
        }
        .upload-dropzone .ui-fileupload-filename {
            display: block;
            margin-top: .5rem;
            font-size: .8rem;
            color: #374151;
        }
        .upload-hint {
            margin-top: .6rem;
            font-size: .75rem;
            color: #9ca3af;
        }

        /* ============ Rodapé ============ */
        .dlg-footer {
            display: flex;
            justify-content: flex-end;
            gap: .6rem;
            margin-top: 1.5rem;
        }
        .ui-button.save-btn {
            background: #4f46e5;
            border-color: #4f46e5;
            border-radius: 10px;
            font-weight: 600;
            padding: .5rem 1.3rem;
        }
        .ui-button.save-btn:hover {
            background: #4338ca;
            border-color: #4338ca;
        }
        .ui-button.cancel-btn {
            background: #fff;
            border: 1px solid #d1d5db;
            color: #374151;
            border-radius: 10px;
            padding: .5rem 1.1rem;
        }
        .ui-button.cancel-btn:hover {
            background: #f9fafb;
            border-color: #9ca3af;
        }
    </style>

    <h:form id="createForm" enctype="multipart/form-data">
        <p:growl id="messages" showDetail="true" />

        <p:dialog id="createDialog" widgetVar="createDialog" modal="true" closeOnEscape="true"
            resizable="false" draggable="false" showEffect="fade" hideEffect="fade"
            styleClass="add-document-dialog" responsive="true">

            <f:facet name="header">
                <div class="dlg-header">
                    <span class="dlg-header-icon"><i class="pi pi-file-pdf" /></span>
                    <div class="dlg-title-text">
                        <h2>Adicionar documento</h2>
                        <p>Carregue um ficheiro e associe-o a um tipo</p>
                    </div>
                </div>
            </f:facet>

            <div class="field-block">
                <h:outputText styleClass="field-label" value="Nome do ficheiro" />
                <p:inputText value="#{documentController.document.fileName}" styleClass="w-full"
                    placeholder="Ex.: Certidão de nascimento - João" />
            </div>

            <div class="field-block">
                <h:outputText styleClass="field-label" value="Tipo de documento" />
                <p:selectOneMenu value="#{documentController.document.documentType}" styleClass="w-full">
                    <f:selectItem itemLabel="Selecione o tipo" itemValue="" />
                    <f:selectItem itemLabel="Certidão de Nascimento" itemValue="CERTIDAO_NASCIMENTO" />
                    <f:selectItem itemLabel="Bilhete de Identidade" itemValue="BILHETE_IDENTIDADE" />
                    <f:selectItem itemLabel="Cartão de Vacinação" itemValue="CARTAO_VACINA" />
                    <f:selectItem itemLabel="Declaração de Transferência" itemValue="DECLARACAO_TRANSFERENCIA" />
                    <f:selectItem itemLabel="Certificado" itemValue="CERTIFICADO" />
                    <f:selectItem itemLabel="Outro" itemValue="OTHER" />
                </p:selectOneMenu>
            </div>

            <div class="field-block">
                <h:outputText styleClass="field-label" value="Aluno" />
                <p:selectOneMenu value="#{documentController.selectedStudentId}" styleClass="w-full"
                    required="true" requiredMessage="Selecione o aluno do documento.">
                    <f:selectItem itemLabel="Selecione o aluno" itemValue="" />
                    <f:selectItems value="#{documentController.students}" var="student"
                        itemLabel="#{student.sudentNumber} - #{student.fullName}"
                        itemValue="#{student.pkStudent}" />
                </p:selectOneMenu>
            </div>

            <div class="field-block">
                <h:outputText styleClass="field-label" value="Ficheiro" />
                <div class="upload-dropzone">
                    <p:fileUpload id="fileUpload" value="#{documentController.document.uploadedFile}"
                        mode="simple" skinSimple="true"
                        allowTypes="/(\.|\/)(gif|jpe?g|png|pdf)$/"
                        label="Escolher ficheiro" styleClass="upload-button" />
                    <div class="upload-hint">Formatos aceites: PDF, JPG, PNG e GIF</div>
                </div>
            </div>

            <div class="dlg-footer">
                <p:commandButton value="Cancelar" type="button"
                    onclick="PF('createDialog').hide()" styleClass="cancel-btn" />
                <p:commandButton value="Guardar" icon="pi pi-check"
                    actionListener="#{documentController.add}"
                    process="@form" update="@form :dashboardTable" resetValues="true"
                    onstart="showLoader()"
                    oncomplete="hideLoader(); if (args &amp;&amp; args.saved) PF('createDialog').hide()"
                    styleClass="save-btn" />
            </div>
        </p:dialog>
    </h:form>
</ui:fragment>
