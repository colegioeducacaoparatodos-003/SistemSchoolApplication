<ui:composition template="/components/dashboard/dashboard-layout.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:define name="titulo">#{msg['teachers']}</ui:define>

    <h:outputStylesheet library="webjars" name="bootstrap/5.3.2/css/bootstrap.min.css" />
    <h:outputStylesheet name="general.css" library="css" />
    <h:outputScript name="general.js" library="js" />
    <h:outputScript name="teacher.js" library="js" />

    <ui:define name="content">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&amp;family=DM+Mono:wght@400;500&amp;display=swap');

            :root {
                --tch-black: #141414;
                --tch-black-mid: #262626;
                --tch-black-lt: #2c3033;
                --tch-red: #c8102e;
                --tch-red-lt: #e2233f;
                --tch-red-pale: #fdecee;
                --tch-yellow: #f5b400;
                --tch-yellow-lt: #ffd93d;
                --tch-yellow-pale: #fff8e1;
                --tch-blue: #1a5fb4;
                --tch-blue-pale: #eaf1fb;
                --tch-white: #ffffff;
                --tch-surface: #ffffff;
                --tch-surface-2: #f7f7f8;
                --tch-border: #e6e6e8;
                --tch-border-dk: #cfcfd2;
                --tch-text: #141414;
                --tch-muted: #666a70;
                --tch-faint: #a1a3a7;
                --tch-radius-sm: 6px;
                --tch-radius: 12px;
                --tch-radius-lg: 14px;
                --tch-shadow-sm: 0 1px 4px rgba(17, 19, 21, .07);
                --tch-shadow: 0 4px 20px rgba(20, 20, 20, .10);
                --font: 'DM Sans', system-ui, sans-serif;
                --font-mono: 'DM Mono', monospace;
            }

            body {
                background: var(--tch-surface-2);
                font-family: var(--font);
            }

            .tch-page {
                padding: 1.2rem;
            }

            @media(min-width:768px) {
                .tch-page {
                    padding: 1.6rem 2rem 2.5rem;
                }
            }

            /* ── Page header ── */
            .tch-header {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 1rem;
                margin-bottom: 1.4rem;
            }

            .tch-header-left {
                display: flex;
                align-items: center;
                gap: 1rem;
            }

            .tch-header-icon {
                width: 46px;
                height: 46px;
                border-radius: 12px;
                background: linear-gradient(135deg, var(--tch-black) 0%, var(--tch-red) 100%);
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--tch-yellow);
                font-size: 1.2rem;
                flex-shrink: 0;
            }

            .tch-header-title h1 {
                font-size: 1.35rem;
                font-weight: 800;
                color: var(--tch-text);
                margin: 0 0 .2rem;
            }

            .tch-header-title p {
                font-size: .85rem;
                color: var(--tch-muted);
                margin: 0;
            }

            .breadcrumb-pill {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                background: var(--tch-yellow-pale);
                border: 1px solid rgba(245, 180, 0, .35);
                color: #8a6400;
                border-radius: 99px;
                padding: 3px 12px;
                font-size: .72rem;
                font-weight: 600;
            }

            /* ── Stat cards ── */
            .tch-stats {
                display: grid;
                grid-template-columns: repeat(1, 1fr);
                gap: .9rem;
                margin-bottom: 1.4rem;
            }

            @media(min-width:576px) {
                .tch-stats {
                    grid-template-columns: repeat(2, 1fr);
                }
            }

            @media(min-width:992px) {
                .tch-stats {
                    grid-template-columns: repeat(4, 1fr);
                }
            }

            .tch-stat {
                background: var(--tch-surface);
                border: 1px solid var(--tch-border);
                border-radius: var(--tch-radius);
                box-shadow: var(--tch-shadow-sm);
                padding: 1.1rem 1.2rem;
                display: flex;
                align-items: center;
                justify-content: space-between;
                transition: box-shadow .2s, transform .2s;
            }

            .tch-stat:hover {
                box-shadow: var(--tch-shadow);
                transform: translateY(-2px);
            }

            .tch-stat-label {
                font-size: .72rem;
                color: var(--tch-muted);
                text-transform: uppercase;
                letter-spacing: .04em;
                font-weight: 700;
            }

            .tch-stat-value {
                font-size: 1.5rem;
                font-weight: 800;
                color: var(--tch-text);
                margin-top: .15rem;
            }

            .tch-stat-icon {
                width: 42px;
                height: 42px;
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.1rem;
            }

            .tch-stat-icon.dark {
                background: var(--tch-black);
                color: var(--tch-yellow);
            }

            .tch-stat-icon.green {
                background: #e8f6ec;
                color: #1e8e3e;
            }

            .tch-stat-icon.yellow {
                background: var(--tch-yellow-pale);
                color: #8a6400;
            }

            .tch-stat-icon.red {
                background: var(--tch-red-pale);
                color: var(--tch-red);
            }

            /* ── Main card ── */
            .tch-card {
                background: var(--tch-surface);
                border: 1px solid var(--tch-border);
                border-radius: var(--tch-radius);
                box-shadow: var(--tch-shadow);
                overflow: hidden;
            }

            .tch-toolbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 1rem 1.2rem;
                border-bottom: 1px solid var(--tch-border);
                gap: 1rem;
                flex-wrap: wrap;
            }

            .tch-toolbar-left {
                display: flex;
                align-items: center;
                gap: 1rem;
                flex-wrap: wrap;
                flex-grow: 1;
            }

            .tch-toolbar-right {
                display: flex;
                align-items: center;
                gap: .6rem;
                flex-wrap: wrap;
            }

            .tch-search-wrap {
                position: relative;
                display: flex;
                align-items: center;
            }

            .tch-search-wrap .pi-search {
                position: absolute;
                left: 10px;
                color: var(--tch-muted);
                font-size: .8rem;
            }

            .tch-search-input {
                padding: 7px 10px 7px 30px;
                border: 1px solid var(--tch-border);
                border-radius: 8px;
                font-size: .85rem;
                width: 100%;
                background: var(--tch-surface-2);
                outline: none;
                font-family: var(--font);
                color: var(--tch-text);
                transition: border-color .2s, box-shadow .2s;
            }

            @media(min-width:768px) {
                .tch-search-input {
                    width: 260px;
                }
            }

            .tch-search-input:focus {
                border-color: var(--tch-red);
                background: #fff;
                box-shadow: 0 0 0 3px rgba(200, 16, 46, .1);
            }

            /* ── DataTable ── */
            .tch-table.p-datatable .p-datatable-thead>tr>th {
                background: var(--tch-black) !important;
                color: var(--tch-yellow) !important;
                font-family: var(--font) !important;
                font-size: .7rem !important;
                font-weight: 600 !important;
                letter-spacing: .6px !important;
                text-transform: uppercase !important;
                border-color: var(--tch-black) !important;
                padding: .7rem 1rem !important;
                white-space: nowrap;
            }

            .tch-table.p-datatable .p-datatable-thead>tr>th .p-sortable-column-icon {
                color: var(--tch-yellow) !important;
                font-size: .65rem !important;
            }

            .tch-table.p-datatable .p-datatable-tbody>tr>td {
                font-family: var(--font) !important;
                font-size: .82rem !important;
                color: var(--tch-text) !important;
                border-bottom: 1px solid var(--tch-surface-2) !important;
                padding: .72rem 1rem !important;
                vertical-align: middle !important;
            }

            .tch-table.p-datatable .p-datatable-tbody>tr:nth-child(even)>td {
                background: #fafafa !important;
            }

            .tch-table.p-datatable .p-datatable-tbody>tr:hover>td {
                background: var(--tch-surface-2) !important;
            }

            .tch-table.p-datatable .p-paginator {
                background: var(--tch-surface-2) !important;
                border-top: 1px solid var(--tch-border) !important;
                padding: .6rem 1rem !important;
                font-size: .78rem !important;
            }

            .tch-table.p-datatable .p-paginator .p-paginator-page.p-highlight {
                background: var(--tch-red) !important;
                color: #fff !important;
                border-radius: var(--tch-radius-sm) !important;
            }

            /* ── Cell components ── */
            .t-num {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                background: var(--tch-black-mid);
                color: var(--tch-yellow);
                border-radius: 5px;
                padding: 3px 9px;
                font-family: var(--font-mono);
                font-size: .75rem;
                font-weight: 600;
            }

            .tch-avatar {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: var(--tch-surface-2);
                border: 1px solid var(--tch-border);
                color: var(--tch-muted);
                font-size: 1rem;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
                overflow: hidden;
            }

            .tch-avatar img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .t-name {
                font-weight: 700;
                font-size: .83rem;
                color: var(--tch-text);
            }

            .t-spec {
                font-size: .72rem;
                color: var(--tch-muted);
            }

            .qual-pill {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                padding: 3px 10px;
                border-radius: 99px;
                font-size: .72rem;
                font-weight: 700;
                white-space: nowrap;
                background: var(--tch-yellow-pale);
                color: #8a6400;
                border: 1px solid rgba(245, 180, 0, .35);
            }

            .tch-badge {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                padding: 3px 10px;
                border-radius: 99px;
                font-size: .72rem;
                font-weight: 700;
                white-space: nowrap;
            }

            .tch-badge::before {
                content: '';
                width: 6px;
                height: 6px;
                border-radius: 50%;
                flex-shrink: 0;
            }

            .status-ACTIVE {
                background: #e8f6ec;
                color: #1e8e3e;
            }

            .status-ACTIVE::before {
                background: #22a83e;
                box-shadow: 0 0 4px #22a83e;
            }

            .status-ON_LEAVE {
                background: var(--tch-yellow-pale);
                color: #8a6400;
            }

            .status-ON_LEAVE::before {
                background: var(--tch-yellow);
            }

            .status-SUSPENDED {
                background: var(--tch-red-pale);
                color: #8a0e21;
            }

            .status-SUSPENDED::before {
                background: var(--tch-red);
            }

            .status-RESIGNED {
                background: var(--tch-red-pale);
                color: #8a0e21;
            }

            .status-RESIGNED::before {
                background: var(--tch-red);
            }

            .status-RETIRED {
                background: var(--tch-blue-pale);
                color: var(--tch-blue);
            }

            .status-RETIRED::before {
                background: var(--tch-blue);
            }

            .status-TERMINATED {
                background: var(--tch-red-pale);
                color: #8a0e21;
            }

            .status-TERMINATED::before {
                background: var(--tch-red);
            }

            .status-DECEASED {
                background: #ececed;
                color: #47494b;
            }

            .status-DECEASED::before {
                background: #6b6d71;
            }

            .tch-actions {
                display: flex;
                align-items: center;
                gap: 4px;
                justify-content: center;
                flex-wrap: wrap;
            }

            .tch-act {
                width: 30px;
                height: 30px;
                border-radius: 6px;
                border: 1px solid var(--tch-border);
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-size: .8rem;
                cursor: pointer;
                transition: all .15s;
            }

            .tch-act:hover {
                transform: scale(1.08);
            }

            .tch-act.edit {
                color: #8a6400;
                background: var(--tch-yellow-pale);
            }

            .tch-act.delete {
                color: var(--tch-red);
                background: var(--tch-red-pale);
            }

            .tch-empty {
                text-align: center;
                padding: 3rem 1rem;
                color: var(--tch-muted);
            }

            .tch-empty i {
                font-size: 2.5rem;
                opacity: .2;
                margin-bottom: .5rem;
                display: block;
            }

            .tch-dialog-footer {
                display: flex;
                justify-content: flex-end;
                gap: .6rem;
                margin-top: .5rem;
                flex-wrap: wrap;
            }

            /* ===== LOADING OVERLAY (padrão igual ao módulo de alunos) ===== */
            .sc-loading-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(20, 20, 20, .85);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                z-index: 9999;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                opacity: 0;
                visibility: hidden;
                transition: opacity .35s ease, visibility .35s ease;
            }

            .sc-loading-overlay.active {
                opacity: 1;
                visibility: visible;
            }

            .sc-loading-box {
                background: var(--tch-surface);
                border-radius: var(--tch-radius);
                padding: 2.5rem 3rem;
                box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1.2rem;
                border: 1px solid var(--tch-border);
                min-width: 260px;
                transform: scale(.9);
                transition: transform .35s cubic-bezier(.34, 1.56, .64, 1);
            }

            .sc-loading-overlay.active .sc-loading-box {
                transform: scale(1);
            }

            .sc-loader-rings {
                position: relative;
                width: 72px;
                height: 72px;
            }

            .sc-loader-rings::before,
            .sc-loader-rings::after {
                content: '';
                position: absolute;
                border-radius: 50%;
                border: 3px solid transparent;
            }

            .sc-loader-rings::before {
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border-top-color: var(--tch-red);
                border-right-color: var(--tch-yellow);
                animation: scSpin 1.2s linear infinite;
            }

            .sc-loader-rings::after {
                top: 10px;
                left: 10px;
                width: calc(100% - 20px);
                height: calc(100% - 20px);
                border-bottom-color: var(--tch-black);
                border-left-color: #e63946;
                animation: scSpinReverse .9s linear infinite;
            }

            .sc-loader-core {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 16px;
                height: 16px;
                background: linear-gradient(135deg, var(--tch-red), var(--tch-yellow));
                border-radius: 50%;
                animation: scPulse 1s ease-in-out infinite;
                box-shadow: 0 0 15px rgba(200, 16, 46, .5);
            }

            @keyframes scSpin {
                0% {
                    transform: rotate(0);
                }

                100% {
                    transform: rotate(360deg);
                }
            }

            @keyframes scSpinReverse {
                0% {
                    transform: rotate(0);
                }

                100% {
                    transform: rotate(-360deg);
                }
            }

            @keyframes scPulse {

                0%,
                100% {
                    transform: translate(-50%, -50%) scale(1);
                    opacity: 1;
                }

                50% {
                    transform: translate(-50%, -50%) scale(1.4);
                    opacity: .7;
                }
            }

            .sc-loading-text {
                font-family: var(--font);
                font-size: 1rem;
                font-weight: 600;
                color: var(--tch-text);
                text-align: center;
            }

            .sc-loading-sub {
                font-size: .78rem;
                color: var(--tch-muted);
                text-align: center;
                margin-top: -.6rem;
            }

            .sc-loading-dots::after {
                content: '';
                animation: scDots 1.5s steps(4, end) infinite;
            }

            @keyframes scDots {
                0% {
                    content: '';
                }

                25% {
                    content: '.';
                }

                50% {
                    content: '..';
                }

                75% {
                    content: '...';
                }

                100% {
                    content: '';
                }
            }

            .sc-loading-progress {
                width: 100%;
                height: 3px;
                background: var(--tch-border);
                border-radius: 99px;
                overflow: hidden;
                margin-top: .3rem;
            }

            .sc-loading-progress-bar {
                height: 100%;
                width: 0%;
                background: linear-gradient(90deg, var(--tch-red), var(--tch-yellow));
                border-radius: 99px;
                animation: scProgress 2s ease-in-out infinite;
            }

            @keyframes scProgress {
                0% {
                    width: 0%;
                    margin-left: 0%;
                }

                50% {
                    width: 60%;
                    margin-left: 20%;
                }

                100% {
                    width: 0%;
                    margin-left: 100%;
                }
            }

            /* ===== Responsividade ===== */
            @media (max-width: 576px) {
                .tch-header {
                    flex-direction: column;
                    align-items: stretch;
                }

                .tch-header-left {
                    width: 100%;
                }

                .tch-toolbar {
                    flex-direction: column;
                    align-items: stretch;
                }

                .tch-toolbar-left,
                .tch-toolbar-right {
                    width: 100%;
                }

                .tch-toolbar-right .ui-button {
                    width: 100%;
                }

                .tch-search-input {
                    width: 100% !important;
                }

                .tch-stat-value {
                    font-size: 1.25rem;
                }

                .tch-act {
                    width: 34px;
                    height: 34px;
                    font-size: .9rem;
                }

                .sc-loading-box {
                    padding: 2rem 1.5rem;
                    min-width: 220px;
                    margin: 0 1rem;
                }
            }
        </style>

        <!-- ===== LOADING OVERLAY ===== -->
        <div id="scLoadingOverlay" class="sc-loading-overlay">
            <div class="sc-loading-box">
                <div class="sc-loader-rings">
                    <div class="sc-loader-core"></div>
                </div>
                <div class="sc-loading-text">#{msg.processing}<span class="sc-loading-dots"></span></div>
                <div class="sc-loading-sub">#{msg.pleaseWait}</div>
                <div class="sc-loading-progress">
                    <div class="sc-loading-progress-bar"></div>
                </div>
            </div>
        </div>

        <div class="tch-page">
            <h:form id="formTeachers">
                <p:growl id="messages" showDetail="true" life="4000" sticky="false" />

                <!-- ── Page Header ── -->
                <div class="tch-header">
                    <div class="tch-header-left">
                        <div class="tch-header-icon"><i class="pi pi-users" /></div>
                        <div class="tch-header-title">
                            <h1>#{msg.teachers}</h1>
                            <p>#{msg.manageTeachers}</p>
                        </div>
                    </div>
                    <span class="breadcrumb-pill">
                        <i class="pi pi-home" style="font-size:.65rem" />#{msg.management} › #{msg.teachers}
                    </span>
                </div>

                <!-- ── Stat Cards ── -->
                <div class="tch-stats">
                    <div class="tch-stat">
                        <div>
                            <div class="tch-stat-label">#{msg.totalTeachers}</div>
                            <div class="tch-stat-value">
                                <h:outputText value="#{teacherController.totalTeacherCount}">
                                    <f:convertNumber pattern="#,##0" />
                                </h:outputText>
                            </div>
                        </div>
                        <div class="tch-stat-icon dark"><i class="pi pi-users" /></div>
                    </div>
                    <div class="tch-stat">
                        <div>
                            <div class="tch-stat-label">#{msg.activeTeachers}</div>
                            <div class="tch-stat-value">
                                <h:outputText value="#{teacherController.activeTeacherCount}">
                                    <f:convertNumber pattern="#,##0" />
                                </h:outputText>
                            </div>
                        </div>
                        <div class="tch-stat-icon green"><i class="pi pi-check-circle" /></div>
                    </div>
                    <div class="tch-stat">
                        <div>
                            <div class="tch-stat-label">#{msg.teachersOnLeave}</div>
                            <div class="tch-stat-value">
                                <h:outputText value="#{teacherController.onLeaveTeacherCount}">
                                    <f:convertNumber pattern="#,##0" />
                                </h:outputText>
                            </div>
                        </div>
                        <div class="tch-stat-icon yellow"><i class="pi pi-clock" /></div>
                    </div>
                    <div class="tch-stat">
                        <div>
                            <div class="tch-stat-label">#{msg.newTeachersLast30Days}</div>
                            <div class="tch-stat-value">
                                <h:outputText value="#{teacherController.newTeacherCount}">
                                    <f:convertNumber pattern="#,##0" />
                                </h:outputText>
                            </div>
                        </div>
                        <div class="tch-stat-icon red"><i class="pi pi-user-plus" /></div>
                    </div>
                </div>

                <!-- ── Main Card ── -->
                <div class="tch-card">
                    <div class="tch-toolbar">
                        <div class="tch-toolbar-left">
                            <span style="font-weight:700; font-size:.9rem; color:var(--tch-text);">
                                <i class="pi pi-list" style="color:var(--tch-red); margin-right:.4rem;" />
                                Lista de Professores
                            </span>
                        </div>

                        <div class="tch-toolbar-right">
                            <p:commandButton value="#{msg.newTeacher}" icon="pi pi-plus"
                                actionListener="#{teacherController.prepareNewTeacher}" update="teacherCreateForm"
                                oncomplete="PF('createTeacherDialog').show()" />
                        </div>
                    </div>

                    <p:dataTable id="dtTeachers" widgetVar="dtTeachers" var="teacher"
                        value="#{teacherController.teachers}" styleClass="tch-table" paginator="true" rows="10"
                        paginatorPosition="bottom" reflow="true"
                        paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                        currentPageReportTemplate="A mostrar {startRecord}–{endRecord} de {totalRecords} professores"
                        rowsPerPageTemplate="5,10,15,25" emptyMessage=" ">

                        <p:column headerText="#{msg.teacher}" sortBy="#{teacher.fristName}" style="min-width:220px">
                            <div style="display:flex; align-items:center; gap:.7rem;">
                                <div class="tch-avatar">
                                    <img src="#{teacher.photoPhath}" alt="#{teacher.fristName}"
                                        rendered="#{not empty teacher.photoPhath}" />
                                    <i class="pi pi-user" rendered="#{empty teacher.photoPhath}"></i>
                                </div>
                                <div>
                                    <div class="t-name">
                                        <h:outputText value="#{teacher.fristName} #{teacher.lastName}" />
                                    </div>
                                    <div class="t-spec">
                                        <span class="t-num">
                                            <i class="pi pi-hashtag"
                                                style="font-size:.65rem; color:var(--tch-yellow)" />
                                            <h:outputText value="#{teacher.teacherNumber}" />
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </p:column>

                        <p:column headerText="#{msg.qualificationLevel}" sortBy="#{teacher.qualificationLivel}"
                            style="width:150px">
                            <span class="qual-pill">
                                <h:outputText
                                    value="#{teacherController.qualificationLabel(teacher.qualificationLivel)}" />
                            </span>
                        </p:column>

                        <p:column headerText="#{msg.email}" sortBy="#{teacher.email}">
                            <h:outputText value="#{teacher.email}" />
                        </p:column>

                        <p:column headerText="#{msg.phone1}" sortBy="#{teacher.phone}" style="width:140px">
                            <h:outputText value="#{teacher.phone}" />
                        </p:column>

                        <p:column headerText="#{msg.status}" sortBy="#{teacher.status}"
                            style="width:130px; text-align:center">
                            <span class="tch-badge status-#{teacher.status}">
                                <h:outputText value="#{teacherController.statusLabel(teacher.status)}" />
                            </span>
                        </p:column>

                        <p:column headerText="#{msg.actions}" style="width:100px;text-align:center" exportable="false">
                            <div class="tch-actions">
                                <p:commandButton icon="pi pi-pencil" title="#{msg.edit}" styleClass="tch-act edit"
                                    actionListener="#{teacherController.setSelectedId(teacher.pkTeacher)}"
                                    action="#{teacherController.openEditDialog}" onstart="showScLoading()"
                                    oncomplete="hideScLoading(); PF('editTeacherDialog').show()"
                                    update=":teacherEditForm" process="@this" />
                                <p:commandButton icon="pi pi-trash" title="#{msg.delete}" styleClass="tch-act delete"
                                    actionListener="#{teacherController.setSelectedId(teacher.pkTeacher)}"
                                    oncomplete="PF('deleteTeacherDialog').show()" process="@this"
                                    update=":formTeachers:confirmDeleteForm" />
                            </div>
                        </p:column>

                        <f:facet name="emptyMessage">
                            <div class="tch-empty">
                                <i class="pi pi-users" />
                                <div>#{msg.noTeacherFound}</div>
                            </div>
                        </f:facet>
                    </p:dataTable>
                </div>

                <!-- Diálogo de confirmação de exclusão -->
                <p:confirmDialog id="deleteTeacherDialog" widgetVar="deleteTeacherDialog"
                    message="#{msg.confirmDeleteTeacher}" header="#{msg.confirmDeletion}" severity="warn">

                    <h:form id="confirmDeleteForm">

                        <p:commandButton value="#{msg.no}" icon="pi pi-times" type="button"
                            styleClass="ui-button-outlined" onclick="PF('deleteTeacherDialog').hide()" />

                        <p:commandButton value="#{msg.yes}" icon="pi pi-check" styleClass="ui-button-danger" ajax="true"
                            action="#{teacherController.delete}" oncomplete="PF('deleteTeacherDialog').hide()"
                            update=":formTeachers:dtTeachers :formTeachers:messages" />

                    </h:form>
                </p:confirmDialog>
            </h:form>
        </div>

        <ui:include src="teachers/teacher-create.xhtml" />
        <ui:include src="teachers/teacher-edit.xhtml" />

        <!-- ===== LOADING SCRIPTS (padrão igual ao módulo de alunos) ===== -->
        <script>
            function showScLoading() {
                var overlay = document.getElementById('scLoadingOverlay');
                if (overlay) { overlay.classList.add('active'); }
            }
            function hideScLoading() {
                var overlay = document.getElementById('scLoadingOverlay');
                if (overlay) { overlay.classList.remove('active'); }
            }
            if (window.PrimeFaces) {
                PrimeFaces.ajax.Queue.originalAdd = PrimeFaces.ajax.Queue.add;
                PrimeFaces.ajax.Queue.add = function (req) {
                    req.originalOncomplete = req.onsuccess;
                    req.onsuccess = function (xhr, status, args) {
                        hideScLoading();
                        if (req.originalOncomplete) { req.originalOncomplete(xhr, status, args); }
                    };
                    req.originalOnerror = req.onerror;
                    req.onerror = function (xhr, status, error) {
                        hideScLoading();
                        if (req.originalOnerror) { req.originalOnerror(xhr, status, error); }
                    };
                    PrimeFaces.ajax.Queue.originalAdd(req);
                };
            }
        </script>
    </ui:define>

</ui:composition>
