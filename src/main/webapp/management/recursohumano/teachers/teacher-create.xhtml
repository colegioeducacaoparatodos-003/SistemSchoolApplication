<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="primefaces">

    <p:dialog id="createTeacherDialog" widgetVar="createTeacherDialog"
        header="Novo Professor" modal="true" showEffect="fade" hideEffect="fade"
        closeOnEscape="true" styleClass="tc-dialog-create" dynamic="true"
        resizable="false" responsive="true" fitViewport="true" width="720">

        <!--
            Nota: este diálogo NÃO usa appendTo="@(body)" propositadamente.
            Quando o diálogo tem o seu próprio h:form (como aqui), o appendTo
            move o DOM do diálogo para fora do form e o PrimeFaces deixa de
            conseguir recolher os valores dos campos via closest("form"),
            fazendo a validação falhar silenciosamente mesmo com os campos
            preenchidos. Ver histórico de bugs do módulo Disciplinas.
        -->
        <h:form id="createTeacherForm" enctype="multipart/form-data" styleClass="ui-fluid">

            <p:messages id="msgsCreate" showDetail="false" closable="true" globalOnly="true" />

            <div class="tc-dialog-body">

                <!-- ====================================================
                     SECCAO 1 – FOTO
                     ==================================================== -->
                <div class="tc-section">
                    <div class="tc-section-title"><i class="pi pi-image"></i> Foto</div>

                    <div class="tc-photo-row">
                        <div class="tc-photo-preview">
                            <p:graphicImage value="/resources/images/default-avatar.png"
                                styleClass="tc-photo-preview-img" />
                        </div>

                        <div class="tc-photo-upload-control">
                            <p:fileUpload id="photoUpload"
                                mode="simple"
                                value="#{teacherController.uploadedPhoto}"
                                allowTypes="/(\.|\/)(gif|jpe?g|png)$/"
                                auto="false"
                                label="Escolher foto"
                                skinSimple="true" />
                        </div>
                    </div>
                </div>

                <!-- ====================================================
                     SECCAO 2 – IDENTIFICACAO
                     ==================================================== -->
                <div class="tc-section">
                    <div class="tc-section-title"><i class="pi pi-id-card"></i> Identificação</div>

                    <div class="tc-field-row">
                        <p:outputLabel for="fristName" value="Primeiro Nome" styleClass="tc-label tc-label-col req" />
                        <div class="tc-field-col">
                            <p:inputText id="fristName" value="#{teacherController.teacher.fristName}" required="true"
                                requiredMessage="O primeiro nome é obrigatório" style="width:100%;" />
                            <p:message for="fristName" display="text" styleClass="tc-field-msg" />
                        </div>
                    </div>

                    <div class="tc-field-row">
                        <p:outputLabel for="lastName" value="Último Nome" styleClass="tc-label tc-label-col req" />
                        <div class="tc-field-col">
                            <p:inputText id="lastName" value="#{teacherController.teacher.lastName}" required="true"
                                requiredMessage="O último nome é obrigatório" style="width:100%;" />
                            <p:message for="lastName" display="text" styleClass="tc-field-msg" />
                        </div>
                    </div>

                    <div class="tc-field-row">
                        <p:outputLabel for="gender" value="Género" styleClass="tc-label tc-label-col" />
                        <div class="tc-field-col">
                            <p:selectOneMenu id="gender" value="#{teacherController.teacher.gender}" style="width:100%;">
                                <f:selectItem itemLabel="Selecione..." itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{teacherController.genders}" var="g"
                                    itemLabel="#{g.descricao}" itemValue="#{g}" />
                            </p:selectOneMenu>
                        </div>
                    </div>

                    <div class="tc-field-row">
                        <p:outputLabel for="qualificationLivel" value="Nível de Qualificação"
                            styleClass="tc-label tc-label-col req" />
                        <div class="tc-field-col">
                            <p:selectOneMenu id="qualificationLivel" value="#{teacherController.teacher.qualificationLivel}"
                                required="true" requiredMessage="Selecione o nível de qualificação" style="width:100%;">
                                <f:selectItem itemLabel="Selecione..." itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{teacherController.qualificationLevels}" var="q"
                                    itemLabel="#{q.descricao}" itemValue="#{q}" />
                            </p:selectOneMenu>
                            <p:message for="qualificationLivel" display="text" styleClass="tc-field-msg" />
                        </div>
                    </div>

                    <div class="tc-field-row">
                        <p:outputLabel for="contractType" value="Tipo de Vínculo" styleClass="tc-label tc-label-col req" />
                        <div class="tc-field-col">
                            <p:selectOneMenu id="contractType" value="#{teacherController.teacher.contractType}"
                                required="true" requiredMessage="Selecione o tipo de vínculo" style="width:100%;">
                                <f:selectItem itemLabel="Selecione..." itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{teacherController.contractTypes}" var="c"
                                    itemLabel="#{c.descricao}" itemValue="#{c}" />
                            </p:selectOneMenu>
                            <p:message for="contractType" display="text" styleClass="tc-field-msg" />
                        </div>
                    </div>

                    <div class="tc-field-row">
                        <p:outputLabel for="status" value="Estado" styleClass="tc-label tc-label-col req" />
                        <div class="tc-field-col">
                            <p:selectOneMenu id="status" value="#{teacherController.teacher.status}"
                                required="true" requiredMessage="Selecione o estado" style="width:100%;">
                                <f:selectItem itemLabel="Selecione..." itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{teacherController.teacherStatuses}" var="s"
                                    itemLabel="#{s.descricao}" itemValue="#{s}" />
                            </p:selectOneMenu>
                            <p:message for="status" display="text" styleClass="tc-field-msg" />
                        </div>
                    </div>

                    <div class="tc-field-row">
                        <p:outputLabel for="biNumber" value="Número do BI" styleClass="tc-label tc-label-col" />
                        <div class="tc-field-col">
                            <p:inputText id="biNumber" value="#{teacherController.teacher.biNumber}" style="width:100%;" />
                        </div>
                    </div>

                    <div class="tc-field-row">
                        <p:outputLabel for="biExpiryDate" value="Validade do BI" styleClass="tc-label tc-label-col" />
                        <div class="tc-field-col">
                            <p:datePicker id="biExpiryDate" value="#{teacherController.teacher.biExpiryDate}"
                                pattern="dd/MM/yyyy" showIcon="true" monthNavigator="true" yearNavigator="true"
                                yearRange="1950:2030" locale="pt" style="width:100%;" />
                        </div>
                    </div>
                </div>

                <!-- ====================================================
                     SECCAO 3 – MORADA
                     ==================================================== -->
                <div class="tc-section">
                    <div class="tc-section-title"><i class="pi pi-map-marker"></i> Endereço</div>

                    <div class="tc-field-row">
                        <p:outputLabel for="addressStreet" value="Endereço" styleClass="tc-label tc-label-col" />
                        <div class="tc-field-col">
                            <p:inputText id="addressStreet" value="#{teacherController.teacher.addressStreet}"
                                style="width:100%;" />
                        </div>
                    </div>

                    <div class="tc-field-row">
                        <p:outputLabel for="addressProvice" value="Província" styleClass="tc-label tc-label-col" />
                        <div class="tc-field-col">
                            <p:inputText id="addressProvice" value="#{teacherController.teacher.addressProvice}"
                                style="width:100%;" />
                        </div>
                    </div>
                </div>

                <!-- ====================================================
                     SECCAO 4 – CONTACTOS E REMUNERACAO
                     ==================================================== -->
                <div class="tc-section">
                    <div class="tc-section-title"><i class="pi pi-phone"></i> Contactos e Remuneração</div>

                    <div class="tc-field-row">
                        <p:outputLabel for="email" value="Email" styleClass="tc-label tc-label-col" />
                        <div class="tc-field-col">
                            <p:inputText id="email" value="#{teacherController.teacher.email}" style="width:100%;">
                                <f:validateRegex pattern="^[^@\s]+@[^@\s]+\.[^@\s]+$" />
                            </p:inputText>
                        </div>
                    </div>

                    <div class="tc-field-row">
                        <p:outputLabel for="phone" value="Telefone Fixo" styleClass="tc-label tc-label-col" />
                        <div class="tc-field-col">
                            <p:inputText id="phone" value="#{teacherController.teacher.phone}" style="width:100%;" />
                        </div>
                    </div>

                    <div class="tc-field-row">
                        <p:outputLabel for="mobilePhone" value="Telemóvel" styleClass="tc-label tc-label-col" />
                        <div class="tc-field-col">
                            <p:inputText id="mobilePhone" value="#{teacherController.teacher.mobilePhone}"
                                style="width:100%;" />
                        </div>
                    </div>

                    <div class="tc-field-row">
                        <p:outputLabel for="baseSalary" value="Salário Base" styleClass="tc-label tc-label-col" />
                        <div class="tc-field-col">
                            <p:inputNumber id="baseSalary" value="#{teacherController.teacher.baseSalary}"
                                symbol=" Kz" symbolPosition="s" decimalPlaces="2" style="width:100%;" />
                        </div>
                    </div>
                </div>

                <!-- ====================================================
                     SECCAO 5 – OBSERVACOES
                     ==================================================== -->
                <div class="tc-section">
                    <div class="tc-section-title"><i class="pi pi-file-edit"></i> Observações</div>
                    <p:inputTextarea id="obs" value="#{teacherController.teacher.obs}" rows="3" autoResize="false"
                        style="width:100%;" />
                </div>

            </div>

            <div class="tc-dialog-footer">
                <p:commandButton value="Cancelar" icon="pi pi-times" type="button"
                    onclick="PF('createTeacherDialog').hide()" styleClass="ui-button-outlined ui-button-secondary"
                    process="@this" />
                <p:commandButton value="Gravar" icon="pi pi-save" styleClass="ui-button-success"
                    action="#{teacherController.save}"
                    update=":createTeacherForm:msgsCreate :formTeachers:dtTeachers :formTeachers:messages"
                    oncomplete="if(!args.validationFailed) PF('createTeacherDialog').hide()"
                    process="@form" />
            </div>

        </h:form>

        <style type="text/css">
            /* ============================================================
               VARIAVEIS
               ============================================================ */
            :root {
                --tc-primary: #c8102e;
                --tc-text-main: #374151;
                --tc-border: #e5e7eb;
                --tc-bg-body: #f9fafb;
            }

            /* ============================================================
               DIALOG – ALTURA TOTAL DO VIEWPORT
               ============================================================ */
            .tc-dialog-create .ui-dialog {
                display: flex !important;
                flex-direction: column !important;
                margin: 0 auto !important;
                border-radius: 8px !important;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04) !important;
            }

            .tc-dialog-create .ui-dialog-titlebar {
                background: #fff !important;
                border-bottom: 1px solid var(--tc-border) !important;
                padding: 1rem 1.25rem !important;
                font-size: 1.1rem !important;
                font-weight: 700 !important;
                color: var(--tc-text-main) !important;
            }

            .tc-dialog-create .ui-dialog-content {
                background: var(--tc-bg-body) !important;
                padding: 0 !important;
                flex: 1 1 auto !important;
                overflow: hidden !important;
                display: flex !important;
                flex-direction: column !important;
            }

            /* ============================================================
               CORPO COM SCROLL INTERNO
               ============================================================ */
            .tc-dialog-body {
                flex: 1 1 auto !important;
                overflow-y: auto !important;
                padding: 1rem 1.25rem !important;
            }

            /* ============================================================
               SECCOES
               ============================================================ */
            .tc-section {
                background: #fff;
                border-radius: 8px;
                padding: 1rem 1.25rem;
                margin-bottom: 1rem;
                border: 1px solid var(--tc-border);
            }

            .tc-section:last-child {
                margin-bottom: 0;
            }

            .tc-section-title {
                font-size: 0.95rem;
                font-weight: 700;
                color: var(--tc-text-main);
                margin-bottom: 1rem;
                display: flex;
                align-items: center;
                gap: 0.5rem;
                padding-bottom: 0.5rem;
                border-bottom: 1px solid var(--tc-border);
            }

            .tc-section-title i {
                color: var(--tc-primary);
                font-size: 1.1rem;
            }

            /* ============================================================
               LINHAS DE CAMPO – TITULO A ESQUERDA, CAMPO A DIREITA
               ============================================================ */
            .tc-field-row {
                display: flex;
                align-items: flex-start;
                gap: 1rem;
                margin-bottom: 1rem;
            }

            .tc-field-row:last-child {
                margin-bottom: 0;
            }

            .tc-label-col {
                flex: 0 0 150px;
                max-width: 150px;
                padding-top: 0.6rem;
                margin-bottom: 0 !important;
            }

            .tc-field-col {
                flex: 1 1 auto;
                min-width: 0;
            }

            /* ============================================================
               LABELS
               ============================================================ */
            .tc-label {
                font-size: 0.88rem;
                font-weight: 600;
                color: var(--tc-text-main);
                display: block;
            }

            .tc-label.req::after {
                content: " *";
                color: #dc2626;
            }

            /* ============================================================
               MENSAGENS DE VALIDACAO
               ============================================================ */
            .tc-field-msg {
                display: block;
                margin-top: 4px;
                font-size: 0.8rem;
            }

            .tc-field-msg.ui-message-error {
                color: #dc2626;
            }

            /* ============================================================
               INPUTS
               ============================================================ */
            .tc-dialog-create .ui-inputfield,
            .tc-dialog-create .ui-selectonemenu {
                width: 100% !important;
            }

            /* ============================================================
               FOTO – CARTAO DE PRE-VISUALIZACAO + BOTAO A DIREITA
               ============================================================ */
            .tc-photo-row {
                display: flex;
                align-items: center;
                gap: 1.25rem;
            }

            .tc-photo-preview {
                flex: 0 0 84px;
                width: 84px;
                height: 84px;
                border-radius: 10px;
                border: 2px dashed var(--tc-border);
                background: var(--tc-bg-body);
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            .tc-photo-preview-img {
                width: 100% !important;
                height: 100% !important;
                object-fit: cover !important;
            }

            .tc-photo-upload-control {
                flex: 1 1 auto;
                min-width: 0;
                display: flex;
                justify-content: flex-end;
            }

            .tc-photo-upload-control .ui-fileupload {
                width: 100%;
                border: none;
                background: transparent;
            }

            .tc-photo-upload-control .ui-fileupload-buttonbar {
                display: flex;
                justify-content: flex-end;
                gap: 0.5rem;
                border: none;
                background: transparent;
                padding: 0;
            }

            /* ============================================================
               FOOTER
               ============================================================ */
            .tc-dialog-footer {
                display: flex;
                justify-content: flex-end;
                gap: 0.6rem;
                padding: 1rem 1.25rem;
                background: #fff;
                border-top: 1px solid var(--tc-border);
                flex-wrap: wrap;
            }

            /* ============================================================
               RESPONSIVO – DESKTOP (min 1024 px) – margens topo/direita/esquerda/baixo
               ============================================================ */
            @media (min-width: 1024px) {
                .tc-dialog-create .ui-dialog {
                    top: 1.5rem !important;
                    left: 1.5rem !important;
                    right: 1.5rem !important;
                    bottom: 1.5rem !important;
                    width: auto !important;
                    height: auto !important;
                    max-width: 960px !important;
                    max-height: calc(100vh - 3rem) !important;
                }

                .tc-dialog-body {
                    max-height: calc(100vh - 200px) !important;
                }
            }

            /* ============================================================
               RESPONSIVO – TABLET (768 a 1023 px) – margens topo/direita/esquerda/baixo
               ============================================================ */
            @media (min-width: 768px) and (max-width: 1023px) {
                .tc-dialog-create .ui-dialog {
                    top: 1rem !important;
                    left: 1rem !important;
                    right: 1rem !important;
                    bottom: 1rem !important;
                    width: auto !important;
                    height: auto !important;
                    max-width: 900px !important;
                    max-height: calc(100vh - 2rem) !important;
                }

                .tc-dialog-body {
                    max-height: calc(100vh - 180px) !important;
                }

                .tc-label-col {
                    flex-basis: 130px;
                    max-width: 130px;
                }
            }

            /* ============================================================
               RESPONSIVO – MOBILE (max 767 px) – margens topo/direita/esquerda/baixo
               ============================================================ */
            @media (max-width: 767px) {
                .tc-dialog-create .ui-dialog {
                    top: 0.5rem !important;
                    left: 0.5rem !important;
                    right: 0.5rem !important;
                    bottom: 0.5rem !important;
                    width: auto !important;
                    height: auto !important;
                    max-width: none !important;
                    max-height: calc(100vh - 1rem) !important;
                    margin: 0 !important;
                    border-radius: 6px !important;
                }

                .tc-dialog-body {
                    padding: 0.75rem !important;
                    max-height: calc(100vh - 150px) !important;
                }

                .tc-section {
                    padding: 0.75rem;
                }

                .tc-label-col {
                    flex-basis: 110px;
                    max-width: 110px;
                    padding-top: 0.5rem;
                }

                .tc-field-row {
                    gap: 0.6rem;
                }

                .tc-dialog-footer {
                    padding: 0.75rem;
                    gap: 0.5rem;
                }

                .tc-dialog-footer .ui-button {
                    flex: 1 1 auto;
                    min-width: 0;
                }
            }

            /* ============================================================
               RESPONSIVO – MOBILE PEQUENO (max 576 px) – margens topo/direita/esquerda/baixo
               ============================================================ */
            @media (max-width: 576px) {
                .tc-dialog-create .ui-dialog {
                    top: 0.25rem !important;
                    left: 0.25rem !important;
                    right: 0.25rem !important;
                    bottom: 0.25rem !important;
                    max-height: calc(100vh - 0.5rem) !important;
                    border-radius: 4px !important;
                }

                .tc-dialog-body {
                    padding: 0.5rem !important;
                    max-height: calc(100vh - 140px) !important;
                }

                .tc-section {
                    padding: 0.6rem;
                    margin-bottom: 0.6rem;
                }

                .tc-section-title {
                    font-size: 0.9rem;
                    margin-bottom: 0.75rem;
                }

                .tc-label-col {
                    flex-basis: 92px;
                    max-width: 92px;
                }

                .tc-label {
                    font-size: 0.8rem;
                }

                .tc-photo-row {
                    gap: 0.75rem;
                }

                .tc-photo-preview {
                    flex-basis: 64px;
                    width: 64px;
                    height: 64px;
                }

                .tc-dialog-footer {
                    flex-direction: column-reverse;
                    padding: 0.6rem;
                }

                .tc-dialog-footer .ui-button {
                    width: 100%;
                }
            }
        </style>
    </p:dialog>

</ui:composition>
