<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui" xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <p:dialog id="editMovementDialog" widgetVar="editMovementDialog" header="#{msg.editMovement}" modal="true"
              showEffect="fade" hideEffect="fade" closeOnEscape="true" style="width: 90vw; max-width: 800px;" dynamic="true"
              resizable="false" appendTo="@(body)" styleClass="sc-dialog-edit" responsive="true" fitViewport="true">

        <h:form id="movementEditForm" styleClass="ui-fluid">
            <p:messages id="msgsEdit" showDetail="true" closable="true" globalOnly="true" />

            <div class="sc-dialog-body">
                <div class="sc-section-title">
                    <i class="pi pi-hashtag"></i> #{msg.movementIdentification}
                </div>

                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank"
                    columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">

                    <p:outputLabel for="movementNumberEdit" value="#{msg.movementNumber}" styleClass="sc-label req" />
                    <p:inputText id="movementNumberEdit" value="#{financialMovementController.editDto.movementNumber}"
                        required="true" styleClass="sc-input" />

                    <p:outputLabel for="movementDateEdit" value="#{msg.movementDate}" styleClass="sc-label" />
                    <p:datePicker id="movementDateEdit" value="#{financialMovementController.editDto.movementDate}"
                        pattern="dd/MM/yyyy HH:mm" showTime="true" showIcon="true" locale="pt"
                        yearNavigator="true" monthNavigator="true" yearRange="2020:2035" />

                </p:panelGrid>

                <div class="sc-section-title" style="margin-top:1.2rem;">
                    <i class="pi pi-link"></i> #{msg.linkedRecords}
                </div>

                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank"
                    columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">

                    <p:outputLabel for="cashBoxEdit" value="#{msg.cashBox}" styleClass="sc-label req" />
                    <h:panelGroup>
                        <p:selectOneMenu id="cashBoxEdit" value="#{financialMovementController.selectedCashBoxId}" required="true"
                            requiredMessage="#{msg.selectCashBox}" style="width:100%;">
                            <f:selectItem itemLabel="&#8212; #{msg.select} &#8212;" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{financialMovementController.cashBoxes}" var="cb"
                                itemLabel="#{cb.cashBoxNumber}" itemValue="#{cb.phCashBox}" />
                        </p:selectOneMenu>
                        <p:message for="cashBoxEdit" display="text" styleClass="sc-field-msg" />
                    </h:panelGroup>

                    <p:outputLabel for="paymentEdit" value="#{msg.payment}" styleClass="sc-label" />
                    <p:selectOneMenu id="paymentEdit" value="#{financialMovementController.selectedPagamentoId}" style="width:100%;">
                        <f:selectItem itemLabel="&#8212; #{msg.none} &#8212;" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{financialMovementController.pagamentos}" var="pm"
                            itemLabel="#{pm.numeroDocumento}" itemValue="#{pm.pkPagamento}" />
                    </p:selectOneMenu>

                </p:panelGrid>

                <div class="sc-section-title" style="margin-top:1.2rem;">
                    <i class="pi pi-money-bill"></i> #{msg.movementDetails}
                </div>

                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank"
                    columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">

                    <p:outputLabel for="descriptionEdit" value="#{msg.description}" styleClass="sc-label req" />
                    <h:panelGroup>
                        <p:inputText id="descriptionEdit" value="#{financialMovementController.editDto.description}" required="true"
                            requiredMessage="#{msg.descriptionRequired}" styleClass="sc-input" />
                        <p:message for="descriptionEdit" display="text" styleClass="sc-field-msg" />
                    </h:panelGroup>

                    <p:outputLabel for="amountEdit" value="#{msg.amount}" styleClass="sc-label req" />
                    <h:panelGroup>
                        <p:inputNumber id="amountEdit" value="#{financialMovementController.editDto.amount}"
                            symbol="Kz " symbolPosition="p" decimalPlaces="2" required="true"
                            requiredMessage="#{msg.amountRequired}" styleClass="sc-input" />
                        <p:message for="amountEdit" display="text" styleClass="sc-field-msg" />
                    </h:panelGroup>

                    <p:outputLabel for="typeEdit" value="#{msg.type}" styleClass="sc-label req" />
                    <h:panelGroup>
                        <p:selectOneMenu id="typeEdit" value="#{financialMovementController.editDto.type}" required="true"
                            requiredMessage="#{msg.selectType}" style="width:100%;">
                            <f:selectItem itemLabel="&#8212; #{msg.select} &#8212;" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{financialMovementController.types}" var="type" itemValue="#{type}" itemLabel="#{msg['movementType.'.concat(type)]}" />
                        </p:selectOneMenu>
                        <p:message for="typeEdit" display="text" styleClass="sc-field-msg" />
                    </h:panelGroup>

                    <p:outputLabel for="categoryEdit" value="#{msg.category}" styleClass="sc-label" />
                    <p:inputText id="categoryEdit" value="#{financialMovementController.editDto.category}" styleClass="sc-input" />

                    <p:outputLabel for="responsibleEdit" value="#{msg.responsible}" styleClass="sc-label" />
                    <p:inputText id="responsibleEdit" value="#{financialMovementController.editDto.responsible}" styleClass="sc-input" />

                    <p:outputLabel for="statusEdit" value="#{msg.status}" styleClass="sc-label" />
                    <p:selectOneMenu id="statusEdit" value="#{financialMovementController.editDto.status}" style="width:100%;">
                        <f:selectItem itemLabel="&#8212; #{msg.select} &#8212;" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{financialMovementController.statuses}" var="status" itemValue="#{status}" itemLabel="#{msg['movementStatus.'.concat(status)]}" />
                    </p:selectOneMenu>

                </p:panelGrid>

                <div class="sc-fullwidth-field">
                    <p:outputLabel for="observationEdit" value="#{msg.observation}" styleClass="sc-label" />
                    <p:inputTextarea id="observationEdit" value="#{financialMovementController.editDto.observation}" rows="3"
                        maxlength="500" counter="obsCounterEdit" counterTemplate="{0} / 500"
                        placeholder="#{msg.additionalNotesPlaceholder}" style="width:100%;" />
                    <h:outputText id="obsCounterEdit" styleClass="sc-counter" />
                </div>
            </div>

            <div class="sc-dialog-footer">
                <p:commandButton value="#{msg.cancel}" icon="pi pi-times" type="button"
                    onclick="PF('editMovementDialog').hide()" styleClass="ui-button-outlined ui-button-secondary" />
                <p:commandButton value="#{msg.save}" icon="pi pi-save" styleClass="ui-button-success"
                    action="#{financialMovementController.saveUpdate}" process="@form"
                    update=":movementEditForm:msgsEdit :formMovements:dtMovements :formMovements:messages"
                    oncomplete="if (!args.validationFailed) { PF('editMovementDialog').hide(); }" />
            </div>
        </h:form>

        <style type="text/css">
            /* <![CDATA[ */
            .sc-dialog-edit .ui-dialog-content { padding: 0 !important; }
            .sc-dialog-body {
                padding: 1.2rem 1.5rem 1rem;
                max-height: calc(90vh - 120px);
                overflow-y: auto;
            }
            .sc-section-title {
                font-size: 1rem; font-weight: 700; margin-bottom: 1rem;
                display: flex; align-items: center; gap: .5rem;
                color: var(--mov-text, #141414);
            }
            .sc-section-title i { color: var(--mov-red, #c8102e); }
            .sc-label {
                font-size: .88rem; font-weight: 600; color: #374151;
                margin-bottom: .35rem; display: block;
            }
            .sc-label.req::after { content: " *"; color: #dc2626; }
            .sc-field-msg {
                display: block; margin-top: 4px;
                font-size: 12px; color: #dc2626;
            }
            .sc-input { width: 100%; }
            .sc-fullwidth-field { margin-top: 1.2rem; }
            .sc-counter {
                display: block; text-align: right;
                font-size: 11px; color: #888; margin-top: 2px;
            }
            .sc-dialog-footer {
                display: flex; justify-content: flex-end; gap: .6rem;
                padding: 1rem 1.5rem; border-top: 1px solid #e5e7eb;
                flex-wrap: wrap; background: #fafafa;
                border-radius: 0 0 12px 12px;
            }
            .sc-dialog-footer .ui-button { min-width: 120px; }

            .sc-dialog-body::-webkit-scrollbar { width: 5px; }
            .sc-dialog-body::-webkit-scrollbar-track { background: transparent; }
            .sc-dialog-body::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 99px; }

            @media (max-width: 768px) {
                .sc-dialog-edit { width: 95vw !important; max-width: 95vw !important; }
                .sc-dialog-body { padding: 1rem; max-height: calc(85vh - 100px); }
                .sc-dialog-footer { padding: .8rem 1rem; flex-direction: column; gap: .5rem; }
                .sc-dialog-footer .ui-button { width: 100%; min-width: unset; }
                .sc-section-title { font-size: .95rem; }
                .sc-label { font-size: .85rem; }
            }
            @media (max-width: 576px) {
                .sc-dialog-body { padding: .8rem; }
                .sc-fullwidth-field { margin-top: 1rem; }
            }
            /* ]]> */
        </style>
    </p:dialog>

</ui:composition>
