<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <p:dialog id="createPagamentoDialog" widgetVar="createPagamentoDialog" header="#{msg.newPayment}" modal="true"
        showEffect="fade" hideEffect="fade" closeOnEscape="true" style="width: 90vw; max-width: 800px;" dynamic="true"
        resizable="false" appendTo="@(body)" styleClass="sc-dialog-create" responsive="true" fitViewport="true">

        <h:form id="pagamentoCreateForm" styleClass="ui-fluid">
            <p:messages id="msgsCreate" showDetail="true" closable="true" globalOnly="true" />

            <div class="sc-dialog-body">
                <div class="sc-section-title">
                    <i class="pi pi-hashtag"></i> #{msg.paymentIdentification}
                </div>

                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank"
                    columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">

                    <p:outputLabel for="paymentNumber" value="#{msg.paymentNumber}" styleClass="sc-label" />
                    <p:inputText id="paymentNumber" value="#{msg.autoGenerated}" readonly="true"
                        styleClass="sc-readonly-field sc-input" />

                    <p:outputLabel for="estado" value="#{msg.status}" styleClass="sc-label" />
                    <p:selectOneMenu id="estado" value="#{pagamentoController.pagamento.estado}" style="width:100%;">
                        <f:selectItem itemLabel="&#8212; #{msg.select} &#8212;" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{pagamentoController.estados}" var="e" itemLabel="#{e.descricao}"
                            itemValue="#{e}" />
                    </p:selectOneMenu>

                    <p:outputLabel for="mesReferencia" value="#{msg.referenceMonth}" styleClass="sc-label" />
                    <p:selectOneMenu id="mesReferencia" value="#{pagamentoController.pagamento.mesReferencia}" style="width:100%;">
                        <f:selectItem itemLabel="&#8212; #{msg.select} &#8212;" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{pagamentoController.mesesReferencia}" var="m"
                            itemLabel="#{m.descricao}" itemValue="#{m}" />
                    </p:selectOneMenu>
                </p:panelGrid>

                <div class="sc-section-title" style="margin-top:1.2rem;">
                    <i class="pi pi-link"></i> #{msg.linkedRecords}
                </div>
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank"
                    columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">

                    <p:outputLabel for="enrolment" value="#{msg.enrolment}" styleClass="sc-label req" />
                    <h:panelGroup>
                        <p:selectOneMenu id="enrolment" value="#{pagamentoController.selectedEnrolmentId}"
                            required="true" requiredMessage="#{msg.enrolment} #{msg.isRequired}" style="width:100%;">
                            <f:selectItem itemLabel="&#8212; #{msg.select} &#8212;" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{pagamentoController.enrolments}" var="enr"
                                itemLabel="#{enr.enrolmentNumer} &#8212; #{enr.student.fullName}"
                                itemValue="#{enr.phEnrolment}" />
                        </p:selectOneMenu>
                        <p:message for="enrolment" display="text" styleClass="sc-field-msg" />
                    </h:panelGroup>

                    <p:outputLabel for="fee" value="#{msg.fee}" styleClass="sc-label req" />
                    <h:panelGroup>
                        <p:selectOneMenu id="fee" value="#{pagamentoController.selectedFeeId}" required="true"
                            requiredMessage="#{msg.fee} #{msg.isRequired}" style="width:100%;">
                            <f:selectItem itemLabel="&#8212; #{msg.select} &#8212;" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{pagamentoController.fees}" var="fee" itemLabel="#{fee.displayLabel}"
                                itemValue="#{fee.phFee}" />
                            <p:ajax event="change" listener="#{pagamentoController.onFeeChange}"
                                update="valor multa totalDisplay totalHidden"
                                oncomplete="calcularTotalPagamento('Create', 'pagamentoCreateForm')" />
                        </p:selectOneMenu>
                        <p:message for="fee" display="text" styleClass="sc-field-msg" />
                    </h:panelGroup>

                    <p:outputLabel for="cashBox" value="#{msg.cashBox}" styleClass="sc-label req" />
                    <h:panelGroup>
                        <p:selectOneMenu id="cashBox" value="#{pagamentoController.selectedCashBoxId}" required="true"
                            requiredMessage="#{msg.cashBox} #{msg.isRequired}" style="width:100%;">
                            <f:selectItem itemLabel="&#8212; #{msg.select} &#8212;" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{pagamentoController.cashBoxes}" var="cb"
                                itemLabel="#{cb.cashBoxNumber}" itemValue="#{cb.phCashBox}" />
                        </p:selectOneMenu>
                        <p:message for="cashBox" display="text" styleClass="sc-field-msg" />
                    </h:panelGroup>
                </p:panelGrid>

                <div class="sc-section-title" style="margin-top:1.2rem;">
                    <i class="pi pi-money-bill"></i> #{msg.paymentDetails}
                </div>
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank"
                    columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">

                    <p:outputLabel for="valor" value="#{msg.value}" styleClass="sc-label req" />
                    <h:panelGroup>
                        <p:inputNumber id="valor" widgetVar="valorWidgetCreate"
                            value="#{pagamentoController.pagamento.valor}" symbol="Kz " symbolPosition="p"
                            decimalPlaces="2" required="true" requiredMessage="#{msg.value} #{msg.isRequired}"
                            readonly="true" styleClass="sc-input"
                            onchange="calcularTotalPagamento('Create', 'pagamentoCreateForm')" />
                        <p:message for="valor" display="text" styleClass="sc-field-msg" />
                    </h:panelGroup>

                    <p:outputLabel for="multa" value="#{msg.fine}" styleClass="sc-label" />
                    <p:inputNumber id="multa" widgetVar="multaWidgetCreate"
                        value="#{pagamentoController.pagamento.multa}" symbol="Kz " symbolPosition="p"
                        decimalPlaces="2" readonly="true" styleClass="sc-input" />

                    <p:outputLabel for="totalDisplay" value="#{msg.total}" styleClass="sc-label" />
                    <h:panelGroup>
                        <p:inputText id="totalDisplay" readonly="true" styleClass="sc-input sc-total-field"
                            value="#{pagamentoController.pagamento.total}">
                            <f:convertNumber type="currency" currencySymbol="Kz " groupingUsed="true" />
                        </p:inputText>
                        <h:inputHidden id="totalHidden" value="#{pagamentoController.pagamento.total}" />
                        <span class="sc-helper-text">#{msg.value} + #{msg.fine}</span>
                    </h:panelGroup>

                    <p:outputLabel for="formaPagamento" value="#{msg.paymentMethod}" styleClass="sc-label req" />
                    <h:panelGroup>
                        <p:selectOneMenu id="formaPagamento" value="#{pagamentoController.pagamento.formaPagamento}"
                            required="true" requiredMessage="#{msg.paymentMethod} #{msg.isRequired}" style="width:100%;">
                            <f:selectItem itemLabel="&#8212; #{msg.select} &#8212;" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{pagamentoController.formasPagamento}" var="fp"
                                itemLabel="#{fp.descricao}" itemValue="#{fp}" />
                        </p:selectOneMenu>
                        <p:message for="formaPagamento" display="text" styleClass="sc-field-msg" />
                    </h:panelGroup>

                    <p:outputLabel for="dataPagamento" value="#{msg.paymentDate}" styleClass="sc-label" />
                    <p:datePicker id="dataPagamento" value="#{pagamentoController.pagamento.dataPagamento}"
                        pattern="dd/MM/yyyy HH:mm" showIcon="true" style="width:100%;"
                        yearNavigator="true" monthNavigator="true" yearRange="2020:2035" />

                    <p:outputLabel for="referencia" value="#{msg.reference}" styleClass="sc-label" />
                    <p:inputText id="referencia" value="#{pagamentoController.pagamento.referencia}"
                        placeholder="Ex: Multicaixa, Transferencia" styleClass="sc-input" />
                </p:panelGrid>

                <div class="sc-fullwidth-field">
                    <p:outputLabel for="observacao" value="#{msg.observation}" styleClass="sc-label" />
                    <p:inputTextarea id="observacao" value="#{pagamentoController.pagamento.observacao}" rows="3"
                        placeholder="#{msg.additionalNotesPlaceholder}" autoResize="true" style="width:100%;" />
                </div>
            </div>

            <div class="sc-dialog-footer">
                <p:commandButton value="#{msg.cancel}" icon="pi pi-times" type="button"
                    onclick="PF('createPagamentoDialog').hide()" styleClass="ui-button-outlined ui-button-secondary" />
                <p:commandButton value="#{msg.save}" icon="pi pi-save" styleClass="ui-button-success"
                    action="#{pagamentoController.savePagamento}" process="@form"
                    update=":formPagamentos:dtPagamentos msgsCreate :formPagamentos:messages"
                    onstart="showScLoading()"
                    oncomplete="if (!args.validationFailed) { hideScLoading(); PF('createPagamentoDialog').hide(); } else { hideScLoading(); }" />
            </div>
        </h:form>

        <style type="text/css">
            .sc-dialog-create .ui-dialog-content {
                padding: 0 !important;
            }
            .sc-dialog-body {
                padding: 1.2rem 1.5rem 1rem;
                max-height: calc(90vh - 120px);
                overflow-y: auto;
            }
            .sc-section-title {
                font-size: 1rem;
                font-weight: 700;
                margin-bottom: 1rem;
                display: flex;
                align-items: center;
                gap: .5rem;
                color: var(--enr-text, #141414);
            }
            .sc-section-title i {
                color: var(--enr-red, #c8102e);
            }
            .sc-label {
                font-size: .88rem;
                font-weight: 600;
                color: #374151;
                margin-bottom: .35rem;
                display: block;
            }
            .sc-label.req::after {
                content: " *";
                color: #dc2626;
            }
            .sc-field-msg {
                display: block;
                margin-top: 4px;
                font-size: 12px;
                color: #dc2626;
            }
            .sc-input {
                width: 100%;
            }
            .sc-readonly-field {
                opacity: .8;
                cursor: not-allowed;
                background: #f3f4f6 !important;
            }
            .sc-total-field {
                background: var(--enr-black, #141414) !important;
                color: var(--enr-yellow, #f5b400) !important;
                font-family: 'DM Mono', monospace !important;
                font-weight: 700 !important;
                font-size: 1.1rem !important;
                border: none !important;
                border-radius: 8px !important;
                text-align: right !important;
            }
            .sc-total-field.ui-state-disabled {
                opacity: 1 !important;
            }
            .sc-helper-text {
                font-size: .75rem;
                color: var(--enr-muted, #666a70);
                margin-top: 2px;
                display: block;
            }
            .sc-fullwidth-field {
                margin-top: 1.2rem;
            }
            .sc-counter {
                display: block;
                text-align: right;
                font-size: 11px;
                color: #888;
                margin-top: 2px;
            }
            .sc-dialog-footer {
                display: flex;
                justify-content: flex-end;
                gap: .6rem;
                padding: 1rem 1.5rem;
                border-top: 1px solid #e5e7eb;
                flex-wrap: wrap;
                background: #fafafa;
                border-radius: 0 0 12px 12px;
            }
            .sc-dialog-footer .ui-button {
                min-width: 120px;
            }

            .sc-dialog-body::-webkit-scrollbar {
                width: 5px;
            }
            .sc-dialog-body::-webkit-scrollbar-track {
                background: transparent;
            }
            .sc-dialog-body::-webkit-scrollbar-thumb {
                background: #d1d5db;
                border-radius: 99px;
            }

            @media (max-width: 768px) {
                .sc-dialog-create {
                    width: 95vw !important;
                    max-width: 95vw !important;
                }
                .sc-dialog-create .ui-dialog-content {
                    padding: 0 !important;
                }
                .sc-dialog-body {
                    padding: 1rem;
                    max-height: calc(85vh - 100px);
                }
                .sc-dialog-footer {
                    padding: .8rem 1rem;
                    flex-direction: column;
                    gap: .5rem;
                }
                .sc-dialog-footer .ui-button {
                    width: 100%;
                    min-width: unset;
                }
                .sc-section-title {
                    font-size: .95rem;
                }
                .sc-label {
                    font-size: .85rem;
                }
            }
            @media (max-width: 576px) {
                .sc-dialog-body {
                    padding: .8rem;
                }
                .sc-fullwidth-field {
                    margin-top: 1rem;
                }
            }
        </style>
    </p:dialog>

    <script type="text/javascript">
        //<![CDATA[
        function calcularTotalPagamento(mode, formId) {
            var valor = 0;
            var multa = 0;
            if (window.PF) {
                var vWidget = PF('valorWidgetCreate');
                var mWidget = PF('multaWidgetCreate');
                if (vWidget) valor = vWidget.getValue() || 0;
                if (mWidget) multa = mWidget.getValue() || 0;
            }
            var total = parseFloat(valor) + parseFloat(multa);
            if (isNaN(total)) { total = 0; }

            var display = document.getElementById(formId + ':totalDisplay');
            if (display) {
                display.value = total.toLocaleString('pt-PT', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }) + ' Kz';
            }

            var hidden = document.getElementById(formId + ':totalHidden');
            if (hidden) {
                hidden.value = total;
            }
        }
        //]]>
    </script>
</ui:composition>
