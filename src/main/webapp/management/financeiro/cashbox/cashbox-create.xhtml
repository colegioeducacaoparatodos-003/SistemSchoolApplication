<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <p:dialog id="createCashBoxDialog" widgetVar="createCashBoxDialog" header="#{msg.newCashBox}" modal="true"
        showEffect="fade" hideEffect="fade" closeOnEscape="true" style="width: 90vw; max-width: 800px;" dynamic="true"
        resizable="false" appendTo="@(body)" styleClass="sc-dialog-create" responsive="true" fitViewport="true">

        <h:form id="cashBoxCreateForm" styleClass="ui-fluid">
            <p:messages id="msgsCreate" showDetail="true" closable="true" globalOnly="true" />

            <div class="sc-dialog-body">
                <div class="sc-section-title">
                    <i class="pi pi-box"></i> #{msg.cashBoxData}
                </div>

                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank"
                    columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">

                    <p:outputLabel for="cashBoxNumberCreate" value="#{msg.cashBoxNumber}" styleClass="sc-label" />
                    <p:inputText id="cashBoxNumberCreate" value="#{cashBoxController.cashBox.cashBoxNumber}"
                        readonly="true" styleClass="sc-input sc-readonly-field"
                        placeholder="#{msg.autoGenerated}" />

                    <p:outputLabel for="operatorCreate" value="#{msg.responsible}" styleClass="sc-label req" />
                    <h:panelGroup>
                        <p:inputText id="operatorCreate" value="#{cashBoxController.cashBox.operator}"
                            required="true" requiredMessage="#{msg.operatorRequired}" styleClass="sc-input" />
                        <p:message for="operatorCreate" display="text" styleClass="sc-field-msg" />
                    </h:panelGroup>

                    <p:outputLabel for="openingDateCreate" value="#{msg.openingDate}" styleClass="sc-label" />
                    <p:datePicker id="openingDateCreate" value="#{cashBoxController.cashBox.openingDate}"
                        pattern="dd/MM/yyyy" showIcon="true" locale="pt" style="width:100%;" />

                    <p:outputLabel for="openingBalanceCreate" value="#{msg.openingBalance}" styleClass="sc-label req" />
                    <h:panelGroup>
                        <p:inputNumber id="openingBalanceCreate" value="#{cashBoxController.cashBox.openingBalance}"
                            symbol="Kz " symbolPosition="p" decimalPlaces="2" required="true"
                            requiredMessage="#{msg.openingBalanceRequired}" styleClass="sc-input" />
                        <p:message for="openingBalanceCreate" display="text" styleClass="sc-field-msg" />
                    </h:panelGroup>

                    <p:outputLabel for="statusCreate" value="#{msg.status}" styleClass="sc-label" />
                    <p:selectOneMenu id="statusCreate" value="#{cashBoxController.cashBox.status}" style="width:100%;">
                        <f:selectItem itemLabel="&#8212; #{msg.select} &#8212;" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{cashBoxController.statuses}" var="st" itemLabel="#{msg['cashBoxStatus.'.concat(st.name())]}" itemValue="#{st}" />
                    </p:selectOneMenu>

                </p:panelGrid>

                <div class="sc-fullwidth-field">
                    <p:outputLabel for="observationCreate" value="#{msg.observation}" styleClass="sc-label" />
                    <p:inputTextarea id="observationCreate" value="#{cashBoxController.cashBox.observation}" rows="3"
                        maxlength="500" counter="obsCounterCreate" counterTemplate="{0} / 500"
                        placeholder="#{msg.additionalNotesPlaceholder}" style="width:100%;" />
                    <h:outputText id="obsCounterCreate" styleClass="sc-counter" />
                </div>
            </div>

            <div class="sc-dialog-footer">
                <p:commandButton value="#{msg.cancel}" icon="pi pi-times" type="button"
                    onclick="PF('createCashBoxDialog').hide()" styleClass="ui-button-outlined ui-button-secondary" />
                <p:commandButton value="#{msg.save}" icon="pi pi-save" styleClass="ui-button-success"
                    action="#{cashBoxController.saveCashBox}" process="@form"
                    update="msgsCreate :formCashBoxes:dtCashBoxes :formCashBoxes:messages"
                    onstart="showScLoading()"
                    oncomplete="hideScLoading(); if (!args.validationFailed) { PF('createCashBoxDialog').hide(); }" />
            </div>
        </h:form>

        <style type="text/css">
            /* <![CDATA[ */
            .sc-dialog-create .ui-dialog-content {
                padding: 0 !important;
            }
            .sc-dialog-body {
                padding: 1.2rem 1.5rem 1rem;
                max-height: calc(90vh - 120px);
                overflow-y: auto;
            }
            .sc-section-title {
                font-size: 1rem;
                font-weight: 700;
                margin-bottom: 1rem;
                display: flex;
                align-items: center;
                gap: .5rem;
                color: var(--enr-text, #141414);
            }
            .sc-section-title i {
                color: var(--enr-red, #c8102e);
            }
            .sc-label {
                font-size: .88rem;
                font-weight: 600;
                color: #374151;
                margin-bottom: .35rem;
                display: block;
            }
            .sc-label.req::after {
                content: " *";
                color: #dc2626;
            }
            .sc-field-msg {
                display: block;
                margin-top: 4px;
                font-size: 12px;
                color: #dc2626;
            }
            .sc-input {
                width: 100%;
            }
            .sc-readonly-field {
                background: #f3f4f6 !important;
                opacity: .8;
                cursor: not-allowed;
            }
            .sc-fullwidth-field {
                margin-top: 1.2rem;
            }
            .sc-counter {
                display: block;
                text-align: right;
                font-size: 11px;
                color: #888;
                margin-top: 2px;
            }
            .sc-dialog-footer {
                display: flex;
                justify-content: flex-end;
                gap: .6rem;
                padding: 1rem 1.5rem;
                border-top: 1px solid #e5e7eb;
                flex-wrap: wrap;
                background: #fafafa;
                border-radius: 0 0 12px 12px;
            }
            .sc-dialog-footer .ui-button {
                min-width: 120px;
            }

            /* Scrollbar customizada */
            .sc-dialog-body::-webkit-scrollbar {
                width: 5px;
            }
            .sc-dialog-body::-webkit-scrollbar-track {
                background: transparent;
            }
            .sc-dialog-body::-webkit-scrollbar-thumb {
                background: #d1d5db;
                border-radius: 99px;
            }

            /* Mobile */
            @media (max-width: 768px) {
                .sc-dialog-create {
                    width: 95vw !important;
                    max-width: 95vw !important;
                }
                .sc-dialog-create .ui-dialog-content {
                    padding: 0 !important;
                }
                .sc-dialog-body {
                    padding: 1rem;
                    max-height: calc(85vh - 100px);
                }
                .sc-dialog-footer {
                    padding: .8rem 1rem;
                    flex-direction: column;
                    gap: .5rem;
                }
                .sc-dialog-footer .ui-button {
                    width: 100%;
                    min-width: unset;
                }
                .sc-section-title {
                    font-size: .95rem;
                }
                .sc-label {
                    font-size: .85rem;
                }
            }
            @media (max-width: 576px) {
                .sc-dialog-body {
                    padding: .8rem;
                }
                .sc-fullwidth-field {
                    margin-top: 1rem;
                }
            }
            /* ]]> */
        </style>
    </p:dialog>

</ui:composition>
