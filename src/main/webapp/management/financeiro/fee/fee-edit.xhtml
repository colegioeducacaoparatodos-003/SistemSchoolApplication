<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <p:dialog id="editFeeDialog" widgetVar="editFeeDialog" header="#{msg.editFee}" modal="true"
        showEffect="fade" hideEffect="fade" closeOnEscape="true" style="width: 90vw; max-width: 800px;" dynamic="true"
        resizable="false" appendTo="@(body)" styleClass="sc-dialog-edit" responsive="true" fitViewport="true">

        <h:form id="feeEditForm" styleClass="ui-fluid">
            <p:messages id="msgsEdit" showDetail="true" closable="true" globalOnly="true" />

            <div class="sc-dialog-body">
                <div class="sc-section-title">
                    <i class="pi pi-pencil"></i> #{msg.editFee}
                </div>

                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank"
                    columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">

                    <p:outputLabel for="feeCodeEdit" value="#{msg.feeCode}" styleClass="sc-label req" />
                    <p:inputText id="feeCodeEdit" value="#{feeController.editDto.feeCode}" required="true" styleClass="sc-input" />

                    <p:outputLabel for="feeTypeEdit" value="#{msg.feeType}" styleClass="sc-label req" />
                    <h:panelGroup>
                        <p:selectOneMenu id="feeTypeEdit" value="#{feeController.editDto.feeType}" required="true"
                            requiredMessage="#{msg.selectFeeType}" style="width:100%;">
                            <f:selectItem itemLabel="&#8212; #{msg.select} &#8212;" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{feeController.feeTypes}" var="ft" itemLabel="#{ft}" itemValue="#{ft}" />
                        </p:selectOneMenu>
                        <p:message for="feeTypeEdit" display="text" styleClass="sc-field-msg" />
                    </h:panelGroup>

                    <p:outputLabel for="schoolClassEdit" value="#{msg.schoolClass}" styleClass="sc-label req" />
                    <h:panelGroup>
                        <p:selectOneMenu id="schoolClassEdit" value="#{feeController.selectedSchoolClassId}"
                            required="true" requiredMessage="#{msg.selectSchoolClass}" filter="true"
                            filterMatchMode="contains" style="width:100%;">
                            <f:selectItem itemLabel="&#8212; #{msg.select} &#8212;" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{feeController.schoolClasses}" var="sc"
                                itemLabel="#{sc.classCode} &#8212; #{sc.className}" itemValue="#{sc.pkSchoolClass}" />
                        </p:selectOneMenu>
                        <p:message for="schoolClassEdit" display="text" styleClass="sc-field-msg" />
                    </h:panelGroup>

                    <p:outputLabel for="statusEdit" value="#{msg.status}" styleClass="sc-label" />
                    <p:selectOneMenu id="statusEdit" value="#{feeController.editDto.status}" style="width:100%;">
                        <f:selectItem itemLabel="&#8212; #{msg.select} &#8212;" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{feeController.statuses}" var="st" itemLabel="#{st}" itemValue="#{st}" />
                    </p:selectOneMenu>

                    <p:outputLabel for="amountEdit" value="#{msg.amount}" styleClass="sc-label req" />
                    <h:panelGroup>
                        <p:inputNumber id="amountEdit" value="#{feeController.editDto.amount}" symbol="Kz " symbolPosition="p"
                            decimalPlaces="2" required="true" requiredMessage="#{msg.amountRequired}" styleClass="sc-input" />
                        <p:message for="amountEdit" display="text" styleClass="sc-field-msg" />
                    </h:panelGroup>

                    <p:outputLabel for="schoolYearEdit" value="#{msg.schoolYear}" styleClass="sc-label" />
                    <p:inputNumber id="schoolYearEdit" value="#{feeController.editDto.schoolYear}" decimalPlaces="0"
                        thousandSeparator="" placeholder="Ex: 2026" styleClass="sc-input" />

                    <p:outputLabel for="startDateEdit" value="#{msg.startDate}" styleClass="sc-label" />
                    <p:datePicker id="startDateEdit" value="#{feeController.editDto.startDate}" pattern="dd/MM/yyyy"
                        showIcon="true" locale="pt" style="width:100%;" yearNavigator="true" monthNavigator="true"
                        yearRange="2020:2035" />

                    <p:outputLabel for="endDateEdit" value="#{msg.endDate}" styleClass="sc-label" />
                    <p:datePicker id="endDateEdit" value="#{feeController.editDto.endDate}" pattern="dd/MM/yyyy"
                        showIcon="true" locale="pt" style="width:100%;" yearNavigator="true" monthNavigator="true"
                        yearRange="2020:2035" />

                </p:panelGrid>

                <div class="sc-fullwidth-field">
                    <p:outputLabel for="descriptionEdit" value="#{msg.description}" styleClass="sc-label req" />
                    <p:inputText id="descriptionEdit" value="#{feeController.editDto.description}" required="true"
                        placeholder="#{msg.feeDescriptionPlaceholder}" style="width:100%;" />
                    <p:message for="descriptionEdit" display="text" styleClass="sc-field-msg" />
                </div>

                <div class="sc-fullwidth-field">
                    <p:outputLabel for="obsEdit" value="#{msg.observation}" styleClass="sc-label" />
                    <p:inputTextarea id="obsEdit" value="#{feeController.editDto.obs}" rows="3" maxlength="500"
                        counter="obsCounterEdit" counterTemplate="{0} / 500"
                        placeholder="#{msg.additionalNotesPlaceholder}" style="width:100%;" />
                    <h:outputText id="obsCounterEdit" styleClass="sc-counter" />
                </div>
            </div>

            <div class="sc-dialog-footer">
                <p:commandButton value="#{msg.cancel}" icon="pi pi-times" type="button"
                    onclick="PF('editFeeDialog').hide()" styleClass="ui-button-outlined ui-button-secondary" />
                <p:commandButton value="#{msg.save}" icon="pi pi-save" styleClass="ui-button-success"
                    action="#{feeController.saveUpdate}" process="@form"
                    update=":feeEditForm:msgsEdit :formFees:dtFees :formFees:messages"
                    oncomplete="if (!args.validationFailed) { PF('editFeeDialog').hide(); }" />
            </div>
        </h:form>

        <style type="text/css">
            /* <![CDATA[ */
            .sc-dialog-edit .ui-dialog-content {
                padding: 0 !important;
            }
            .sc-dialog-body {
                padding: 1.2rem 1.5rem 1rem;
                max-height: calc(90vh - 120px);
                overflow-y: auto;
            }
            .sc-section-title {
                font-size: 1rem;
                font-weight: 700;
                margin-bottom: 1rem;
                display: flex;
                align-items: center;
                gap: .5rem;
                color: var(--enr-text, #141414);
            }
            .sc-section-title i {
                color: var(--enr-red, #c8102e);
            }
            .sc-label {
                font-size: .88rem;
                font-weight: 600;
                color: #374151;
                margin-bottom: .35rem;
                display: block;
            }
            .sc-label.req::after {
                content: " *";
                color: #dc2626;
            }
            .sc-field-msg {
                display: block;
                margin-top: 4px;
                font-size: 12px;
                color: #dc2626;
            }
            .sc-input {
                width: 100%;
            }
            .sc-fullwidth-field {
                margin-top: 1.2rem;
            }
            .sc-counter {
                display: block;
                text-align: right;
                font-size: 11px;
                color: #888;
                margin-top: 2px;
            }
            .sc-dialog-footer {
                display: flex;
                justify-content: flex-end;
                gap: .6rem;
                padding: 1rem 1.5rem;
                border-top: 1px solid #e5e7eb;
                flex-wrap: wrap;
                background: #fafafa;
                border-radius: 0 0 12px 12px;
            }
            .sc-dialog-footer .ui-button {
                min-width: 120px;
            }

            /* Scrollbar customizada */
            .sc-dialog-body::-webkit-scrollbar {
                width: 5px;
            }
            .sc-dialog-body::-webkit-scrollbar-track {
                background: transparent;
            }
            .sc-dialog-body::-webkit-scrollbar-thumb {
                background: #d1d5db;
                border-radius: 99px;
            }

            /* Mobile */
            @media (max-width: 768px) {
                .sc-dialog-edit {
                    width: 95vw !important;
                    max-width: 95vw !important;
                }
                .sc-dialog-edit .ui-dialog-content {
                    padding: 0 !important;
                }
                .sc-dialog-body {
                    padding: 1rem;
                    max-height: calc(85vh - 100px);
                }
                .sc-dialog-footer {
                    padding: .8rem 1rem;
                    flex-direction: column;
                    gap: .5rem;
                }
                .sc-dialog-footer .ui-button {
                    width: 100%;
                    min-width: unset;
                }
                .sc-section-title {
                    font-size: .95rem;
                }
                .sc-label {
                    font-size: .85rem;
                }
            }
            @media (max-width: 576px) {
                .sc-dialog-body {
                    padding: .8rem;
                }
                .sc-fullwidth-field {
                    margin-top: 1rem;
                }
            }
            /* ]]> */
        </style>
    </p:dialog>

</ui:composition>
