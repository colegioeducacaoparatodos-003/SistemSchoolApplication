<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui" xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <p:dialog id="createReceiptDialog" widgetVar="createReceiptDialog" header="#{msg.newReceipt}" modal="true"
              showEffect="fade" hideEffect="fade" closeOnEscape="true" styleClass="sc-dialog-create" width="800"
              dynamic="true" resizable="false" appendTo="@(body)">

        <h:form id="receiptCreateForm" styleClass="ui-fluid">
            <div class="sc-create-body">
                <p:messages id="msgs" showDetail="true" closable="true"/>

                <!-- 1 · IDENTIFICAÇÃO DO RECIBO -->
                <div class="sc-section">
                    <div class="sc-section-title"><i class="pi pi-hashtag"></i> #{msg.receiptIdentification}</div>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank" columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">
                        <p:outputLabel for="receiptNumber" value="#{msg.receiptNumber}" styleClass="sc-label req"/>
                        <p:inputText id="receiptNumber" value="#{receiptController.receipt.receiptNumber}"
                                     required="true" placeholder="Ex: REC-2026-000001"/>

                        <p:outputLabel for="status" value="#{msg.status}" styleClass="sc-label"/>
                        <p:selectOneMenu id="status" value="#{receiptController.receipt.status}">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{receiptController.statuses}"/>
                        </p:selectOneMenu>
                    </p:panelGrid>
                </div>

                <!-- 2 · VÍNCULOS -->
                <div class="sc-section">
                    <div class="sc-section-title"><i class="pi pi-link"></i> #{msg.linkedRecords}</div>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank" columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">
                        <p:outputLabel for="payment" value="#{msg.payment}" styleClass="sc-label req"/>
                        <p:selectOneMenu id="payment" value="#{receiptController.selectedPaymentId}" required="true">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{receiptController.payments}" var="pm"
                                           itemLabel="#{pm.paymentNumber}" itemValue="#{pm.phPayment}"/>
                        </p:selectOneMenu>

                        <p:outputLabel for="issueDate" value="#{msg.issueDate}" styleClass="sc-label"/>
                        <p:datePicker id="issueDate" value="#{receiptController.receipt.issueDate}"
                                      pattern="dd/MM/yyyy HH:mm" showTime="true" showIcon="true"/>
                    </p:panelGrid>
                </div>

                <!-- 3 · DETALHES DO RECIBO -->
                <div class="sc-section accent">
                    <div class="sc-section-title"><i class="pi pi-money-bill"></i> #{msg.receiptDetails}</div>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank" columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">
                        <p:outputLabel for="issuedBy" value="#{msg.issuedBy}" styleClass="sc-label"/>
                        <p:inputText id="issuedBy" value="#{receiptController.receipt.issuedBy}"/>
                    </p:panelGrid>

                    <p:outputLabel for="observation" value="#{msg.observation}" styleClass="sc-label"/>
                    <p:inputTextarea id="observation" value="#{receiptController.receipt.observation}" rows="3"
                                     placeholder="#{msg.additionalNotesPlaceholder}"/>
                </div>

            </div>

            <div class="sc-create-footer">
                <p:commandButton value="#{msg.cancel}" icon="pi pi-times"
                                 styleClass="sc-btn-cancel"
                                 type="button"
                                 onclick="PF('createReceiptDialog').hide()"/>

                <p:commandButton value="#{msg.save}" icon="pi pi-save"
                                 styleClass="sc-btn-save"
                                 action="#{receiptController.saveReceipt}"
                                 process="@form"
                                 update=":formReceipts:dtReceipts msgs :formReceipts:messages"
                                 oncomplete="if (!args.validationFailed) { PF('createReceiptDialog').hide(); }"/>
            </div>
        </h:form>
    </p:dialog>

</ui:composition>
