<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui" xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <p:dialog id="editScheduleDialog" widgetVar="editScheduleDialog" header="#{msg.editSchedule}" modal="true"
              showEffect="fade" hideEffect="fade" closeOnEscape="true" styleClass="sch-dialog-edit" width="700"
              dynamic="true" resizable="false" appendTo="@(body)">

        <h:form id="scheduleEditForm" styleClass="ui-fluid">
            <div class="sc-create-body">
                <p:messages id="msgsEdit" showDetail="true" closable="true" globalOnly="true"/>

                <div class="sc-section">
                    <div class="sc-section-title"><i class="pi pi-calendar"></i> #{msg.scheduleDetails}</div>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank"
                                 columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">

                        <p:outputLabel for="teacher" value="#{msg.teacher}" styleClass="sc-label req"/>
                        <p:selectOneMenu id="teacher" value="#{scheduleController.selectedTeacherId}" required="true">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{scheduleController.teachers}" var="t"
                                           itemLabel="#{t.name}" itemValue="#{t.pkTeacher}"/>
                        </p:selectOneMenu>

                        <p:outputLabel for="discipline" value="#{msg.discipline}" styleClass="sc-label req"/>
                        <p:selectOneMenu id="discipline" value="#{scheduleController.selectedDisciplineId}" required="true">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{scheduleController.disciplines}" var="d"
                                           itemLabel="#{d.disciplineName}" itemValue="#{d.pkDiscipline}"/>
                        </p:selectOneMenu>

                        <p:outputLabel for="schoolClass" value="#{msg.schoolClass}" styleClass="sc-label req"/>
                        <p:selectOneMenu id="schoolClass" value="#{scheduleController.selectedSchoolClassId}" required="true">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{scheduleController.schoolClasses}" var="sc"
                                           itemLabel="#{sc.name}" itemValue="#{sc.pkSchoolClass}"/>
                        </p:selectOneMenu>

                        <p:outputLabel for="weekDay" value="#{msg.weekDay}" styleClass="sc-label req"/>
                        <p:selectOneMenu id="weekDay" value="#{scheduleController.editDto.weekDay}" required="true">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{scheduleController.weekDays}" var="wd"
                                           itemLabel="#{wd.description}" itemValue="#{wd}"/>
                        </p:selectOneMenu>

                        <p:outputLabel for="startTime" value="#{msg.startTime}" styleClass="sc-label req"/>
                        <p:datePicker id="startTime" value="#{scheduleController.editDto.startTime}"
                                      timeOnly="true" pattern="HH:mm" stepMinute="5" required="true"/>

                        <p:outputLabel for="endTime" value="#{msg.endTime}" styleClass="sc-label req"/>
                        <p:datePicker id="endTime" value="#{scheduleController.editDto.endTime}"
                                      timeOnly="true" pattern="HH:mm" stepMinute="5" required="true"/>

                        <p:outputLabel for="classroom" value="#{msg.classroom}" styleClass="sc-label req"/>
                        <p:inputText id="classroom" value="#{scheduleController.editDto.classroom}" required="true"/>

                    </p:panelGrid>
                </div>
            </div>

            <div class="sc-create-footer">
                <p:commandButton value="#{msg.cancel}" icon="pi pi-times"
                                 styleClass="sc-btn-cancel"
                                 type="button"
                                 onclick="PF('editScheduleDialog').hide()"/>

                <p:commandButton value="#{msg.save}" icon="pi pi-save"
                                 styleClass="sc-btn-save"
                                 actionListener="#{scheduleController.saveUpdate}"
                                 process="@form"
                                 update=":scheduleEditForm:msgsEdit :formSchedules:dtSchedules"
                                 oncomplete="if (!args.validationFailed) { PF('editScheduleDialog').hide(); }"/>
            </div>
        </h:form>
    </p:dialog>

</ui:composition>
