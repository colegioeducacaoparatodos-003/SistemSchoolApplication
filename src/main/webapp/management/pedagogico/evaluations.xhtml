<ui:composition template="/components/dashboard/dashboard-layout.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="titulo">#{msg.evaluationList}</ui:define>

    <h:outputStylesheet library="webjars" name="bootstrap/5.3.2/css/bootstrap.min.css" />
    <h:outputStylesheet name="general.css" library="css" />
    <h:outputScript name="general.js" library="js" />

    <ui:define name="content">
<style>
            @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&amp;family=DM+Mono:wght@400;500&amp;display=swap');

            :root {
                --black: #141414;
                --black-mid: #262626;
                --black-lt: #3a3a3a;
                --red: #c8102e;
                --red-lt: #e63946;
                --red-pale: #fdecee;
                --yellow: #f5b400;
                --yellow-lt: #ffd23f;
                --yellow-pale: #fff8e1;
                --blue: #1a5fb4;
                --blue-pale: #eaf1fb;
                --green: #1e8e3e;
                --green-pale: #e8f6ec;
                --surface: #ffffff;
                --surface-2: #f7f7f8;
                --border: #e6e6e8;
                --border-dk: #cfcfd3;
                --text: #141414;
                --text-muted: #666a70;
                --text-faint: #9a9ea4;
                --radius-sm: 6px;
                --radius: 10px;
                --radius-lg: 14px;
                --shadow-sm: 0 1px 4px rgba(20, 20, 20, .08);
                --shadow: 0 4px 20px rgba(20, 20, 20, .12);
                --font: 'DM Sans', system-ui, sans-serif;
                --font-mono: 'DM Mono', monospace;
            }

            body {
                background: var(--surface-2);
                font-family: var(--font);
            }

            .page-scroll-wrapper {
                height: calc(100vh - 72px);
                overflow-y: auto;
                overflow-x: hidden;
                padding: 1rem;
                box-sizing: border-box;
                scroll-behavior: smooth;
            }

            @media (min-width: 768px) {
                .page-scroll-wrapper {
                    padding: 1.6rem 1.8rem 2.5rem;
                }
            }

            .page-scroll-wrapper::-webkit-scrollbar {
                width: 5px;
            }

            .page-scroll-wrapper::-webkit-scrollbar-track {
                background: transparent;
            }

            .page-scroll-wrapper::-webkit-scrollbar-thumb {
                background: var(--border-dk);
                border-radius: 99px;
            }

            .page-scroll-wrapper::-webkit-scrollbar-thumb:hover {
                background: var(--black-lt);
            }

            .page-header {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 1rem;
                margin-bottom: 1.2rem;
            }

            @media (min-width: 576px) {
                .page-header {
                    align-items: center;
                    margin-bottom: 1.5rem;
                }
            }

            .page-header-left {
                display: flex;
                align-items: center;
                gap: 1rem;
            }

            .page-header-icon {
                width: 42px;
                height: 42px;
                border-radius: var(--radius);
                background: linear-gradient(135deg, var(--black) 0%, var(--red) 100%);
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--yellow);
                font-size: 1.1rem;
                flex-shrink: 0;
                box-shadow: 0 4px 12px rgba(20, 20, 20, .3);
            }

            @media (min-width: 768px) {
                .page-header-icon {
                    width: 48px;
                    height: 48px;
                    font-size: 1.25rem;
                }
            }

            .page-header-title h1 {
                font-size: 1.15rem;
                font-weight: 700;
                color: var(--black);
                margin: 0 0 .15rem;
            }

            @media (min-width: 768px) {
                .page-header-title h1 {
                    font-size: 1.35rem;
                }
            }

            .page-header-title span {
                font-size: .75rem;
                color: var(--text-muted);
            }

            .breadcrumb-pill {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                background: var(--yellow-pale);
                border: 1px solid rgba(245, 180, 0, .35);
                color: #8a6400;
                border-radius: 99px;
                padding: 3px 12px;
                font-size: .7rem;
                font-weight: 600;
            }

            /* ── Stat cards ── */
            .stat-row {
                display: grid;
                grid-template-columns: 1fr;
                gap: .8rem;
                margin-bottom: 1.2rem;
            }

            @media (min-width: 576px) {
                .stat-row {
                    grid-template-columns: repeat(2, 1fr);
                }
            }

            @media (min-width: 992px) {
                .stat-row {
                    grid-template-columns: repeat(4, 1fr);
                    margin-bottom: 1.5rem;
                }
            }

            .stat-card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius-lg);
                box-shadow: var(--shadow-sm);
                padding: .9rem 1rem;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: .8rem;
            }

            .stat-card .stat-label {
                font-size: .72rem;
                color: var(--text-muted);
                text-transform: uppercase;
                letter-spacing: .03em;
                display: block;
                margin-bottom: .2rem;
            }

            .stat-card .stat-value {
                font-size: 1.35rem;
                font-weight: 700;
                color: var(--black);
                font-family: var(--font-mono);
            }

            @media (min-width: 768px) {
                .stat-card .stat-value {
                    font-size: 1.5rem;
                }
            }

            .stat-icon {
                width: 38px;
                height: 38px;
                border-radius: var(--radius);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1rem;
                flex-shrink: 0;
            }

            @media (min-width: 768px) {
                .stat-icon {
                    width: 42px;
                    height: 42px;
                    font-size: 1.1rem;
                }
            }

            .stat-icon.total {
                background: var(--black);
                color: var(--yellow);
            }

            .stat-icon.new {
                background: var(--blue-pale);
                color: var(--blue);
            }

            .stat-icon.open {
                background: var(--green-pale);
                color: var(--green);
            }

            .stat-icon.closed {
                background: var(--red-pale);
                color: var(--red);
            }

            /* ── Main card / table ── */
            .main-card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius-lg);
                box-shadow: var(--shadow);
                overflow: hidden;
            }

            .card-toolbar {
                display: flex;
                align-items: stretch;
                justify-content: space-between;
                padding: .8rem 1rem;
                border-bottom: 1px solid var(--border);
                gap: .8rem;
                flex-direction: column;
            }

            @media (min-width: 768px) {
                .card-toolbar {
                    align-items: center;
                    flex-direction: row;
                    padding: .9rem 1.2rem;
                }
            }

            .toolbar-left {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
                width: 100%;
            }

            @media (min-width: 768px) {
                .toolbar-left {
                    width: auto;
                    gap: 2.5rem;
                }
            }

            .toolbar-title {
                font-size: .82rem;
                font-weight: 700;
                color: var(--black);
                display: flex;
                align-items: center;
                gap: 6px;
                white-space: nowrap;
            }

            .toolbar-right {
                display: flex;
                align-items: center;
                gap: .5rem;
                flex-wrap: wrap;
                width: 100%;
            }

            @media (min-width: 768px) {
                .toolbar-right {
                    width: auto;
                    flex-wrap: nowrap;
                }
            }

            .search-wrap {
                position: relative;
                display: flex;
                align-items: center;
                flex-grow: 1;
            }

            @media (min-width: 768px) {
                .search-wrap {
                    flex-grow: 0;
                }
            }

            .search-wrap .pi-search {
                position: absolute;
                left: 9px;
                color: var(--text-faint);
                font-size: .75rem;
            }

            .search-input {
                padding: 6px 10px 6px 28px;
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                font-size: .8rem;
                width: 100%;
                background: var(--surface-2);
                outline: none;
            }

            @media (min-width: 768px) {
                .search-input {
                    width: 200px;
                }
            }

            .search-input:focus {
                border-color: var(--red);
                box-shadow: 0 0 0 3px rgba(200, 16, 46, .1);
            }

            .btn-new, .btn-ghost {
                flex-grow: 1;
                justify-content: center;
            }

            @media (min-width: 768px) {
                .btn-new, .btn-ghost {
                    flex-grow: 0;
                }
            }

            .btn-new {
                background: linear-gradient(135deg, var(--black) 0%, var(--red) 100%);
                color: #fff;
                border: none;
                border-radius: var(--radius-sm);
                padding: 7px 16px;
                font-size: .8rem;
                font-weight: 600;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                white-space: nowrap;
            }

            .btn-new:hover {
                filter: brightness(1.08);
            }

            .btn-ghost {
                background: var(--surface-2);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                padding: 7px 12px;
                font-size: .8rem;
                font-weight: 600;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                white-space: nowrap;
            }

            .btn-ghost:hover {
                background: var(--border);
            }

            .sc-table.p-datatable .p-datatable-thead>tr>th {
                background: var(--black) !important;
                color: var(--yellow-lt) !important;
                font-size: .7rem !important;
                text-transform: uppercase !important;
                padding: .7rem 1rem !important;
                border-color: var(--black) !important;
            }

            .sc-table.p-datatable .p-datatable-tbody>tr>td {
                font-size: .82rem !important;
                padding: .72rem 1rem !important;
            }

            .sc-table.p-datatable .p-datatable-tbody>tr:hover {
                background: var(--surface-2) !important;
            }

            .t-num {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                background: var(--black-mid);
                color: var(--yellow);
                border-radius: 5px;
                padding: 3px 9px;
                font-family: var(--font-mono);
                font-size: .75rem;
            }

            .t-cell {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .t-icon-badge {
                width: 34px;
                height: 34px;
                border-radius: var(--radius-sm);
                background: var(--black);
                color: var(--yellow);
                font-size: .85rem;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }

            .t-sub {
                font-size: .72rem;
                color: var(--text-muted);
            }

            .weight-badge,
            .trimester-badge {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                padding: 3px 10px;
                border-radius: 99px;
                font-size: .78rem;
                font-weight: 700;
                background: var(--surface-2);
                border: 1px solid var(--border-dk);
                font-family: var(--font-mono);
            }

            .type-badge {
                display: inline-flex;
                align-items: center;
                padding: 3px 10px;
                border-radius: 99px;
                font-size: .72rem;
                font-weight: 700;
                background: var(--blue-pale);
                color: var(--blue);
                border: 1px solid rgba(26, 95, 180, .3);
            }

            .status-badge {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                padding: 3px 10px;
                border-radius: 99px;
                font-size: .72rem;
                font-weight: 700;
            }

            .status-badge.open {
                background: var(--green-pale);
                color: var(--green);
                border: 1px solid rgba(30, 142, 62, .3);
            }

            .status-badge.closed {
                background: var(--red-pale);
                color: var(--red);
                border: 1px solid rgba(200, 16, 46, .3);
            }

            .actions-cell {
                display: flex;
                align-items: center;
                gap: 4px;
                justify-content: center;
            }

            .act-btn {
                width: 28px;
                height: 28px;
                border-radius: var(--radius-sm);
                border: 1px solid var(--border);
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-size: .75rem;
                cursor: pointer;
            }

            .act-btn.edit {
                color: #8a6400;
                background: var(--yellow-pale);
            }

            .act-btn.delete {
                color: var(--red);
                background: var(--red-pale);
            }
        </style>

        <div class="page-scroll-wrapper">
            <h:form id="formEvaluations">
                <p:growl id="messages" showDetail="true" life="4000" />

                <!-- ── Page Header ── -->
                <div class="page-header">
                    <div class="page-header-left">
                        <div class="page-header-icon"><i class="pi pi-file-edit" /></div>
                        <div class="page-header-title">
                            <h1>#{msg.evaluationList}</h1>
                            <span>#{msg.evaluationManagement}</span>
                        </div>
                    </div>
                    <span class="breadcrumb-pill">
                        <i class="pi pi-home" style="font-size:.65rem" /> #{msg.management} › #{msg.pedagogical} › #{msg.evaluations}
                    </span>
                </div>

                <!-- ── Stat cards ── -->
                <div class="stat-row">
                    <div class="stat-card">
                        <div>
                            <span class="stat-label">#{msg.totalEvaluations}</span>
                            <div class="stat-value">
                                <h:outputText value="#{evaluationController.totalEvaluationCount}">
                                    <f:convertNumber pattern="#,##0" />
                                </h:outputText>
                            </div>
                        </div>
                        <div class="stat-icon total"><i class="pi pi-file-edit" /></div>
                    </div>
                    <div class="stat-card">
                        <div>
                            <span class="stat-label">#{msg.newEvaluations}</span>
                            <div class="stat-value">
                                <h:outputText value="#{evaluationController.newEvaluationCount}">
                                    <f:convertNumber pattern="#,##0" />
                                </h:outputText>
                            </div>
                        </div>
                        <div class="stat-icon new"><i class="pi pi-calendar-plus" /></div>
                    </div>
                    <div class="stat-card">
                        <div>
                            <span class="stat-label">#{msg.openEvaluations}</span>
                            <div class="stat-value">
                                <h:outputText value="#{evaluationController.openEvaluationCount}">
                                    <f:convertNumber pattern="#,##0" />
                                </h:outputText>
                            </div>
                        </div>
                        <div class="stat-icon open"><i class="pi pi-lock-open" /></div>
                    </div>
                    <div class="stat-card">
                        <div>
                            <span class="stat-label">#{msg.closedEvaluations}</span>
                            <div class="stat-value">
                                <h:outputText value="#{evaluationController.closedEvaluationCount}">
                                    <f:convertNumber pattern="#,##0" />
                                </h:outputText>
                            </div>
                        </div>
                        <div class="stat-icon closed"><i class="pi pi-lock" /></div>
                    </div>
                </div>

                <!-- ── Main Card ── -->
                <div class="main-card">
                    <div class="card-toolbar">
                        <div class="toolbar-left filter-zone">
                            <span class="toolbar-title"><i class="pi pi-list" style="color:var(--red)" /> #{msg.record}</span>
                            <div class="search-wrap">
                                <input type="text" class="search-input" placeholder="#{msg.search}"
                                    onkeyup="PF('dtEvaluations').filter(this.value, 'global', 'contains')" />
                            </div>
                        </div>
                        <div class="toolbar-right">
                            <p:commandButton icon="pi pi-filter-slash" title="Limpar Filtros" styleClass="btn-ghost"
                                actionListener="#{evaluationController.lazyModel.clearFilters}"
                                update="dtEvaluations" />
                            <p:commandButton value="#{msg.export}" icon="pi pi-file-export" styleClass="btn-ghost" />
                            <p:commandButton value="#{msg.newEvaluation}" icon="pi pi-plus" styleClass="btn-new"
                                oncomplete="PF('createEvaluationDialog').show()" update=":evaluationCreateForm"
                                process="@this" />
                        </div>
                    </div>

                    <p:dataTable id="dtEvaluations" widgetVar="dtEvaluations" styleClass="sc-table" var="evaluation"
                        value="#{evaluationController.lazyModel}" lazy="true" paginator="true" rows="10"
                        paginatorPosition="bottom" reflow="true"
                        paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                        currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords} registos"
                        rowsPerPageTemplate="5,10,15,30" emptyMessage="#{msg.noEvaluationFound}">

                        <p:column headerText="Nº" sortBy="#{evaluation.pkEvaluation}" style="width:80px">
                            <span class="t-num">
                                <i class="pi pi-hashtag" style="font-size:.65rem" />
                                <h:outputText value="#{evaluation.pkEvaluation}" />
                            </span>
                        </p:column>

                        <p:column headerText="#{msg.discipline}" sortBy="#{evaluation.disciplineName}">
                            <div class="t-cell">
                                <div class="t-icon-badge"><i class="pi pi-book" /></div>
                                <div>
                                    <div class="fw-bold text-dark">
                                        <h:outputText value="#{evaluation.disciplineName}" />
                                    </div>
                                    <div class="t-sub">
                                        <h:outputText value="#{evaluation.scheduleWeekDay}" />
                                    </div>
                                </div>
                            </div>
                        </p:column>

                        <p:column headerText="#{msg.title}" sortBy="#{evaluation.title}">
                            <h:outputText value="#{evaluation.title}" />
                        </p:column>

                        <p:column headerText="#{msg.type}" sortBy="#{evaluation.type}"
                            style="width:120px; text-align:center">
                            <span class="type-badge">
                                <h:outputText value="#{msg[evaluation.type.toString()]}" />
                            </span>
                        </p:column>

                        <p:column headerText="#{msg.weight}" sortBy="#{evaluation.weight}"
                            style="width:90px; text-align:center">
                            <span class="weight-badge">
                                <h:outputText value="#{evaluation.weight}">
                                    <f:convertNumber pattern="#,##0.0" />
                                </h:outputText>
                            </span>
                        </p:column>

                        <p:column headerText="#{msg.evaluationDate}" sortBy="#{evaluation.evaluationDate}"
                            style="width:120px">
                            <h:outputText value="#{evaluationController.formatDate(evaluation.evaluationDate)}" />
                        </p:column>

                        <p:column headerText="Trim." sortBy="#{evaluation.trimester}"
                            style="width:70px; text-align:center">
                            <span class="trimester-badge">
                                <h:outputText value="#{evaluation.trimester}" />
                            </span>
                        </p:column>

                        <p:column headerText="#{msg.status}" sortBy="#{evaluation.status}"
                            style="width:120px; text-align:center">
                            <span class="status-badge #{evaluation.status == 'OPEN' ? 'open' : 'closed'}">
                                <i class="pi #{evaluation.status == 'OPEN' ? 'pi-lock-open' : 'pi-lock'}"
                                    style="font-size:.65rem" />
                                <h:outputText value="#{msg[evaluation.status.toString()]}" />
                            </span>
                        </p:column>

                        <p:column headerText="#{msg.actions}" style="width:110px; text-align:center" exportable="false">
                            <div class="actions-cell">
                                <p:commandButton styleClass="act-btn edit" icon="pi pi-pencil" title="Editar"
                                    actionListener="#{evaluationController.openEditDialog}"
                                    oncomplete="PF('editEvaluationDialog').show()" update=":evaluationEditForm">
                                    <f:setPropertyActionListener value="#{evaluation.pkEvaluation}"
                                        target="#{evaluationController.selectedId}" />
                                </p:commandButton>

                                <p:commandButton styleClass="act-btn delete" icon="pi pi-trash" title="Excluir"
                                    process="@this" oncomplete="PF('deleteEvaluationDialog').show()">
                                    <f:setPropertyActionListener value="#{evaluation.pkEvaluation}"
                                        target="#{evaluationController.selectedId}" />
                                </p:commandButton>
                            </div>
                        </p:column>

                        <f:facet name="emptyMessage">
                            <div class="text-center p-5 text-muted">
                                <i class="pi pi-file-edit d-block mb-2" style="font-size:2rem; opacity:.2" />
                                #{msg.noEvaluationFound}
                            </div>
                        </f:facet>
                    </p:dataTable>
                </div>

                <!-- ── Confirm delete dialog ── -->
                <p:dialog widgetVar="deleteEvaluationDialog" modal="true" resizable="false" header="#{msg.confirmDeleteEvaluation}"
                    width="380" closable="true" styleClass="confirm-delete-dialog">
                    <div style="padding: .5rem 0 1rem; display:flex; gap:.8rem; align-items:flex-start;">
                        <i class="pi pi-exclamation-triangle"
                            style="color: var(--red); font-size: 1.6rem; flex-shrink:0;" />
                        <span style="font-size:.88rem; color: var(--text);">
                            #{msg.deleteEvaluationQuestion}
                        </span>
                    </div>
                    <div style="display:flex; justify-content:flex-end; gap:.6rem;">
                        <p:commandButton value="#{msg.no}" type="button" onclick="PF('deleteEvaluationDialog').hide()"
                            style="background: var(--surface-2); color: var(--text); border:1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 16px; font-size:.8rem;" />
                        <p:commandButton value="#{msg.yes}" icon="pi pi-trash"
                            actionListener="#{evaluationController.delete}" process="@this"
                            update=":formEvaluations:dtEvaluations :formEvaluations:messages"
                            oncomplete="PF('deleteEvaluationDialog').hide()"
                            style="background: linear-gradient(135deg, var(--black) 0%, var(--red) 100%); color:#fff; border:none; border-radius: var(--radius-sm); padding: 7px 16px; font-size:.8rem;" />
                    </div>
                </p:dialog>
            </h:form>

            <ui:include src="evaluation/evaluations-create.xhtml" />
            <ui:include src="evaluation/evaluations-edit.xhtml" />
        </div>
    </ui:define>

</ui:composition>
