<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui" xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <p:dialog id="createDisciplineDialog" widgetVar="createDisciplineDialog" header="#{msg.newDiscipline}" modal="true"
              showEffect="fade" hideEffect="fade" closeOnEscape="true" styleClass="disc-dialog-create" width="700"
              dynamic="true" resizable="false" appendTo="@(body)">

        <h:form id="disciplineCreateForm" styleClass="ui-fluid">
            <div class="sc-create-body">
                <p:messages id="msgsCreate" showDetail="true" closable="true" globalOnly="true"/>

                <div class="sc-section">
                    <div class="sc-section-title"><i class="pi pi-book"></i> #{msg.disciplineDetails}</div>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank"
                                 columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">

                        <p:outputLabel for="disciplineCode" value="#{msg.disciplineCode}" styleClass="sc-label req"/>
                        <p:inputText id="disciplineCode" value="#{disciplineController.discipline.disciplineCode}" required="true"/>

                        <p:outputLabel for="disciplineName" value="#{msg.disciplineName}" styleClass="sc-label req"/>
                        <p:inputText id="disciplineName" value="#{disciplineController.discipline.disciplineName}" required="true"/>

                        <p:outputLabel for="workload" value="#{msg.workload}" styleClass="sc-label req"/>
                        <p:inputNumber id="workload" value="#{disciplineController.discipline.workload}"
                                       decimalPlaces="0" required="true"/>

                        <p:outputLabel for="status" value="#{msg.status}" styleClass="sc-label req"/>
                        <p:selectOneMenu id="status" value="#{disciplineController.discipline.status}" required="true">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{disciplineController.statuses}" var="st" itemLabel="#{st}" itemValue="#{st}"/>
                        </p:selectOneMenu>

                    </p:panelGrid>
                </div>
            </div>

            <div class="sc-create-footer">
                <p:commandButton value="#{msg.cancel}" icon="pi pi-times"
                                 styleClass="sc-btn-cancel"
                                 type="button"
                                 onclick="PF('createDisciplineDialog').hide()"/>

                <p:commandButton value="#{msg.save}" icon="pi pi-save"
                                 styleClass="sc-btn-save"
                                 action="#{disciplineController.saveDiscipline}"
                                 process="@form"
                                 update=":disciplineCreateForm:msgsCreate :formDisciplines:dtDisciplines"
                                 oncomplete="if (!args.validationFailed) { PF('createDisciplineDialog').hide(); }"/>
            </div>
        </h:form>
    </p:dialog>

</ui:composition>
