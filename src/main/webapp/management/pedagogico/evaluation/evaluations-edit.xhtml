<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui" xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <!--
        IMPORTANTE:
        Este diálogo é "dynamic=true", o que significa que o seu HTML só é
        renderizado e enviado ao browser quando o form abaixo (id="evaluationEditForm")
        sofre um update via AJAX.

        Por isso, o botão de EDITAR, na tabela (dtEvaluations), precisa de:

            action="#{evaluationController.openEditDialog}"
            update="evaluationEditForm"
            oncomplete="PF('editEvaluationDialog').show()"

        O atributo update é essencial. Sem ele, o diálogo abre sempre com o
        HTML da primeira renderização, vazio, mesmo que o editDto e os
        selectedDisciplineId / selectedScheduleId já estejam preenchidos
        no servidor.
    -->

    <p:dialog id="editEvaluationDialog" widgetVar="editEvaluationDialog" header="#{msg.editEvaluation}" modal="true"
              showEffect="fade" hideEffect="fade" closeOnEscape="true" styleClass="sc-dialog-edit" width="700"
              dynamic="true" resizable="false" appendTo="@(body)">

        <h:form id="evaluationEditForm" styleClass="ui-fluid">
            <div class="sc-create-body">
                <p:messages id="msgsEdit" showDetail="true" closable="true"/>

                <div class="sc-section">
                    <div class="sc-section-title"><i class="pi pi-book"></i> #{msg.evaluationDetails}</div>
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank"
                                 columnClasses="p-col-12 p-md-6, p-col-12 p-md-6">

                        <p:outputLabel for="discipline" value="#{msg.discipline}" styleClass="sc-label req"/>
                        <p:selectOneMenu id="discipline" value="#{evaluationController.selectedDisciplineId}"
                                         converter="jakarta.faces.Long" required="true">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{evaluationController.disciplines}" var="disc"
                                           itemLabel="#{disc.disciplineName}" itemValue="#{disc.pkDiscipline}"/>
                        </p:selectOneMenu>

                        <p:outputLabel for="schedule" value="#{msg.schedule}" styleClass="sc-label req"/>
                        <p:selectOneMenu id="schedule" value="#{evaluationController.selectedScheduleId}"
                                         converter="jakarta.faces.Long" required="true">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{evaluationController.schedules}" var="sch"
                                           itemLabel="#{msg[sch.weekDay.toString()]}" itemValue="#{sch.pkSchedule}"/>
                        </p:selectOneMenu>

                        <p:outputLabel for="title" value="#{msg.title}" styleClass="sc-label req"/>
                        <p:inputText id="title" value="#{evaluationController.editDto.title}" required="true"/>

                        <p:outputLabel for="type" value="#{msg.type}" styleClass="sc-label req"/>
                        <p:selectOneMenu id="type" value="#{evaluationController.editDto.type}" required="true">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{evaluationController.types}" var="tp" itemLabel="#{msg[tp.toString()]}" itemValue="#{tp}"/>
                        </p:selectOneMenu>

                        <p:outputLabel for="weight" value="#{msg.weight}" styleClass="sc-label req"/>
                        <p:inputNumber id="weight" value="#{evaluationController.editDto.weight}" required="true"
                                       decimalPlaces="1" minValue="0" maxValue="20"/>

                        <p:outputLabel for="trimester" value="#{msg.trimester}" styleClass="sc-label req"/>
                        <p:inputNumber id="trimester" value="#{evaluationController.editDto.trimester}" required="true"
                                       decimalPlaces="0" minValue="1" maxValue="3"/>

                        <p:outputLabel for="evaluationDate" value="#{msg.evaluationDate}" styleClass="sc-label req"/>
                        <p:calendar id="evaluationDate" value="#{evaluationController.editDto.evaluationDate}" required="true"
                                    pattern="dd/MM/yyyy" showIcon="true" navigator="true"/>

                        <p:outputLabel for="status" value="#{msg.status}" styleClass="sc-label req"/>
                        <p:selectOneMenu id="status" value="#{evaluationController.editDto.status}" required="true">
                            <f:selectItem itemLabel="— #{msg.select} —" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{evaluationController.statuses}" var="st" itemLabel="#{msg[st.toString()]}" itemValue="#{st}"/>
                        </p:selectOneMenu>

                    </p:panelGrid>
                </div>
            </div>

            <div class="sc-create-footer">
                <p:commandButton value="#{msg.cancel}" icon="pi pi-times"
                                 styleClass="sc-btn-cancel"
                                 type="button"
                                 onclick="PF('editEvaluationDialog').hide()"/>

                <p:commandButton value="#{msg.save}" icon="pi pi-save"
                                 styleClass="sc-btn-save"
                                 action="#{evaluationController.saveUpdate}"
                                 update=":formEvaluations:dtEvaluations :formEvaluations:messages"
                                 oncomplete="if (!args.validationFailed) { PF('editEvaluationDialog').hide(); }"/>
            </div>
        </h:form>
    </p:dialog>

</ui:composition>
