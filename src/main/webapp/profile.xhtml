<ui:composition template="/components/dashboard/dashboard-layout.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="titulo">#{msg.profile}</ui:define>

    <ui:define name="content">
        <style>
            :root {
                --bg-page: #f3f4f6;
                --bg-card: #ffffff;
                --bg-card-alt: #f8fafc;
                --border-subtle: #dbe3ec;
                --text-primary: #111827;
                --text-muted: #6b7280;
                --accent-cyan: #06b6d4;
                --accent-blue: #2563eb;
                --accent-purple: #9333ea;
                --accent-green: #059669;
                --accent-gold: #d97706;
            }

            .dashboard-page {
                padding: 1.5rem;
                background: var(--bg-page);
                color: var(--text-primary);
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                min-height: 100vh;
            }

            @media (min-width: 768px) {
                .dashboard-page {
                    padding: 2rem;
                }
            }

            .dashboard-header {
                margin-bottom: 2rem;
            }

            .dashboard-header h1 {
                font-size: 1.75rem;
                font-weight: 800;
                color: var(--text-primary);
                letter-spacing: -0.02em;
                margin-bottom: 0.375rem;
            }

            .dashboard-header p {
                font-size: 0.9rem;
                color: var(--text-muted);
            }

            /* ===== Cards estatísticos do topo ===== */
            .dashboard-cards {
                display: grid;
                grid-template-columns: repeat(1, 1fr);
                gap: 1.25rem;
                margin-bottom: 2rem;
            }

            @media (min-width: 576px) {
                .dashboard-cards {
                    grid-template-columns: repeat(2, 1fr);
                }
            }

            @media (min-width: 992px) {
                .dashboard-cards {
                    grid-template-columns: repeat(5, 1fr);
                }
            }

            .stat-card {
                background: var(--text-primary);
                border-radius: 14px;
                padding: 1.1rem 1.4rem;
                border: 1px solid var(--border-subtle);
                border-top: 3px solid var(--accent-cyan);
                display: flex;
                flex-direction: column;
                gap: 0.6rem;
                position: relative;
                transition: transform 0.2s ease, box-shadow 0.2s ease;
                margin-left: 23px;
                width: 85.5rem;
                height: 25.5rem;
            }

            .stat-card:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.08);
            }

            .stat-card--cyan {
                border-top-color: var(--accent-cyan);
            }

            .stat-card--green {
                border-top-color: var(--accent-green);
            }

            .stat-card--gold {
                border-top-color: var(--accent-gold);
            }

            .stat-card--purple {
                border-top-color: var(--accent-purple);
            }

            .stat-card--blue {
                border-top-color: var(--accent-blue);
            }

            .stat-card__label {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                font-size: 0.7rem;
                font-weight: 700;
                color: var(--text-muted);
                text-transform: uppercase;
                letter-spacing: 0.06em;
            }

            .stat-card__label .pi {
                font-size: 0.9rem;
                color: var(--text-muted);
            }

            .stat-card__value {
                font-size: 1.7rem;
                font-weight: 800;
                color: var(--text-primary);
                line-height: 1.1;
            }

            @media (min-width: 1024px) {
                .dashboard-charts-row {
                    grid-template-columns: 2fr 1fr;
                }
            }

            .dashboard-chart-panel,
            .dashboard-legend-panel {
                background: var(--bg-card);
                border-radius: 14px;
                padding: 1.5rem;
                border: 1px solid var(--border-subtle);
            }

            .dashboard-legend-panel {
                display: flex;
                flex-direction: column;
            }

            .dashboard-chart-panel h3,
            .dashboard-legend-panel h3 {
                font-size: 1rem;
                font-weight: 700;
                color: var(--text-primary);
                margin-bottom: 0.15rem;
                letter-spacing: -0.01em;
            }

            .dashboard-chart-panel .panel-subtitle,
            .dashboard-legend-panel .panel-subtitle {
                font-size: 0.75rem;
                color: var(--text-muted);
                margin-bottom: 1.25rem;
            }

            .dashboard-chart-panel .ui-chart canvas {
                max-height: 280px !important;
                width: 100% !important;
                height: auto !important;
            }

            .dashboard-legend-panel ul {
                list-style: none;
                padding: 0;
                margin: 0;
                max-height: 260px;
                overflow-y: auto;
                scrollbar-width: thin;
                scrollbar-color: var(--accent-cyan) var(--bg-card-alt);
            }

            .dashboard-legend-panel li {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0.7rem 0;
                border-bottom: 1px solid var(--border-subtle);
            }

            .dashboard-legend-panel li:last-child {
                border-bottom: none;
            }

            .legend-name {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                font-size: 0.85rem;
                color: var(--text-primary);
                font-weight: 600;
            }

            .legend-avatar {
                width: 28px;
                height: 28px;
                border-radius: 50%;
                background: rgba(147, 51, 234, 0.15);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 0.75rem;
                font-weight: 800;
                color: var(--accent-purple);
                flex-shrink: 0;
            }

            .legend-count {
                font-weight: 700;
                color: var(--accent-cyan);
                background: rgba(34, 211, 238, 0.12);
                padding: 0.2rem 0.65rem;
                border-radius: 9999px;
                font-size: 0.75rem;
            }

            /* ===== Cards adicionais inferiores ===== */
            .dashboard-additional-cards {
                display: grid;
                grid-template-columns: 1fr;
                gap: 1.25rem;
            }

            @media (min-width: 768px) {
                .dashboard-additional-cards {
                    grid-template-columns: repeat(2, 1fr);
                }
            }

            @media (min-width: 1200px) {
                .dashboard-additional-cards {
                    grid-template-columns: repeat(3, 1fr);
                }
            }

            .card-title-sm {
                font-size: 0.9rem;
                font-weight: 700;
                color: var(--text-primary);
            }

            .card-subtitle-sm {
                font-size: 0.72rem;
                color: var(--text-muted);
            }
        </style>

        <!-- Cards Estatísticos do Topo -->
        <h:panelGroup layout="block" styleClass="dashboard-cards" id="dashboardCards">
            <!-- Novos Cards de Documentos -->
            <h:panelGroup layout="block" styleClass="stat-card stat-card--purple" data-aos="fade-up"
                data-aos-delay="350">
                <span class="stat-card__label">
                    <h1 class="h3 mb-3">#{msg.profile}: </h1>
                    <h:outputText class="h3 mb-3" value="#{msg[sessionBean.loggedUser.perfil.toString()]}" />
                </span>
                <span class="stat-card__label">
                    <h1 class="h3 mb-3">#{msg.email}: </h1>
                    <h:outputText class="h3 mb-3" value="#{msg[sessionBean.loggedUser.perfil.toString()]}" />
                </span>
            </h:panelGroup>
        </h:panelGroup>


        <div class="p-4">
            <h1 class="h3 mb-3">#{msg.profile}</h1>
            <p:card header="#{msg.profile}">
                <div class="d-flex flex-column gap-1">
                    <div>
                        <strong>Email:</strong>
                        <h:outputText value="#{sessionBean.loggedUser.email}" />
                    </div>
                    <div>
                        <strong>Perfil:</strong>
                        <h:outputText value="#{msg[sessionBean.loggedUser.perfil.toString()]}" />
                    </div>
                </div>
            </p:card>
        </div>
    </ui:define>
</ui:composition>
