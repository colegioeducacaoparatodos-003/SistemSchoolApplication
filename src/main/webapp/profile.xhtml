<ui:composition template="/components/dashboard/dashboard-layout.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="titulo">#{msg.profile}</ui:define>

    <ui:define name="content">
        <style>
            .profile-page {
                max-width: 1200px;
                margin: 0 auto;
                padding: clamp(1rem, 3vw, 2.5rem);
                color: #172033;
            }

            .profile-heading {
                display: flex;
                align-items: center;
                gap: 1rem;
                margin-bottom: 1.75rem;
            }

            .profile-heading-icon {
                display: grid;
                flex: 0 0 52px;
                width: 52px;
                height: 52px;
                place-items: center;
                border: 1px solid #f1d9df;
                border-radius: 16px;
                background: linear-gradient(145deg, #fff7f8, #f7e7eb);
                color: #800020;
                font-size: 1.35rem;
                box-shadow: 0 6px 16px rgba(128, 0, 32, .1);
            }

            .profile-heading h1 {
                margin: 0 0 .3rem;
                font-size: clamp(1.55rem, 3vw, 2rem);
                font-weight: 750;
                letter-spacing: -.035em;
            }

            .profile-heading p {
                margin: 0;
                color: #64748b;
                font-size: .95rem;
            }

            .profile-summary {
                position: relative;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1.5rem;
                padding: clamp(1.5rem, 4vw, 2.25rem);
                margin-bottom: 1.25rem;
                border-color: #5e0018;
                background:
                    radial-gradient(circle at 88% 20%, rgba(255, 215, 0, .22), transparent 24%),
                    radial-gradient(circle at 100% 100%, rgba(255, 255, 255, .09), transparent 38%),
                    linear-gradient(120deg, #3d0010, #800020 58%, #a83232);
                color: #fff;
            }

            .profile-summary::after {
                position: absolute;
                right: 16%;
                bottom: -140px;
                width: 280px;
                height: 280px;
                border: 1px solid rgba(255, 255, 255, .12);
                border-radius: 50%;
                box-shadow: 0 0 0 28px rgba(255, 255, 255, .035), 0 0 0 58px rgba(255, 255, 255, .025);
                content: "";
                pointer-events: none;
            }

            .profile-identity {
                position: relative;
                z-index: 1;
                display: flex;
                min-width: 0;
                align-items: center;
                gap: 1.25rem;
            }

            .profile-avatar {
                display: grid;
                flex: 0 0 76px;
                width: 76px;
                height: 76px;
                place-items: center;
                border: 3px solid rgba(255, 255, 255, .85);
                border-radius: 24px;
                background: linear-gradient(145deg, #e6b947, #b77a19);
                color: #fff;
                font-size: 1.9rem;
                font-weight: 800;
                text-transform: uppercase;
                box-shadow: 0 8px 20px rgba(4, 17, 43, .25);
            }

            .profile-summary h2 {
                margin: 0 0 .35rem;
                overflow-wrap: anywhere;
                color: #fff;
                font-size: clamp(1.05rem, 2.5vw, 1.4rem);
                font-weight: 750;
                letter-spacing: -.02em;
            }

            .profile-eyebrow {
                display: block;
                margin-bottom: .4rem;
                color: #f2d178;
                font-size: .68rem;
                font-weight: 750;
                letter-spacing: .13em;
                text-transform: uppercase;
            }

            .profile-summary p {
                margin: 0;
                color: rgba(226, 237, 255, .78);
                font-size: .9rem;
            }

            .profile-role {
                display: inline-flex;
                align-items: center;
                gap: .4rem;
                margin-top: .9rem;
                padding: .4rem .75rem;
                border: 1px solid rgba(255, 255, 255, .24);
                border-radius: 999px;
                background: rgba(255, 255, 255, .12);
                color: #fff4ce;
                font-size: .82rem;
                font-weight: 700;
            }

            .profile-hero-meta {
                position: relative;
                z-index: 1;
                display: grid;
                flex: 0 0 auto;
                gap: .85rem;
                min-width: 190px;
            }

            .profile-meta-item {
                display: flex;
                align-items: center;
                gap: .7rem;
                padding: .75rem .9rem;
                border: 1px solid rgba(255, 255, 255, .18);
                border-radius: 13px;
                background: rgba(36, 0, 9, .2);
                color: #fff;
                font-size: .86rem;
                font-weight: 650;
            }

            .profile-meta-item i {
                color: #f2d178;
                font-size: 1.05rem;
            }

            .profile-meta-item--inactive i {
                color: #fecaca;
            }

            .profile-meta-item--identifier {
                overflow-wrap: anywhere;
            }

            .profile-panels {
                display: grid;
                grid-template-columns: minmax(0, 1.35fr) minmax(280px, .85fr);
                gap: 1.25rem;
                align-items: stretch;
            }

            .profile-panel {
                overflow: hidden;
                border: 1px solid #e4eaf2;
                border-radius: 20px;
                background: #fff;
                box-shadow: 0 12px 34px rgba(15, 23, 42, .06);
                transition: transform .2s ease, box-shadow .2s ease;
            }

            .profile-panel:hover {
                transform: translateY(-2px);
                box-shadow: 0 16px 38px rgba(15, 23, 42, .09);
            }

            .profile-section-heading {
                display: flex;
                align-items: center;
                gap: .9rem;
                padding: 1.35rem 1.5rem;
                border-bottom: 1px solid #edf1f6;
                background: linear-gradient(110deg, #fff, #fdfafb);
            }

            .profile-section-icon {
                display: grid;
                flex: 0 0 40px;
                width: 40px;
                height: 40px;
                place-items: center;
                border-radius: 12px;
                background: #fbf0f2;
                color: #800020;
                font-size: 1rem;
            }

            .profile-section-heading h2 {
                margin: 0 0 .2rem;
                font-size: 1.02rem;
                font-weight: 700;
            }

            .profile-section-heading p {
                margin: 0;
                color: #8792a4;
                font-size: .82rem;
                line-height: 1.45;
            }

            .profile-grid {
                display: grid;
                grid-template-columns: 1fr;
                padding: .35rem 1.5rem 1rem;
            }

            .profile-item {
                display: flex;
                min-width: 0;
                align-items: center;
                gap: .9rem;
                padding: 1.1rem .5rem;
                border-bottom: 1px solid #edf1f6;
                transition: background-color .18s ease;
            }

            .profile-item:last-child {
                border-bottom: 0;
            }

            .profile-item:hover {
                background: #fdfafb;
            }

            .profile-item-icon {
                display: grid;
                flex: 0 0 40px;
                width: 40px;
                height: 40px;
                place-items: center;
                border: 1px solid #f0e4e7;
                border-radius: 12px;
                background: #fff9fa;
                color: #800020;
                font-size: .95rem;
            }

            .profile-item-content {
                min-width: 0;
            }

            .profile-item-label {
                display: block;
                margin-bottom: .3rem;
                color: #64748b;
                font-size: .73rem;
                font-weight: 700;
                letter-spacing: .06em;
                text-transform: uppercase;
            }

            .profile-item-value {
                display: block;
                overflow-wrap: anywhere;
                color: #172033;
                font-size: .92rem;
                font-weight: 650;
            }

            .profile-status {
                display: inline-flex;
                align-items: center;
                gap: .45rem;
                color: #15803d;
            }

            .profile-status::before {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: #16a34a;
                content: "";
            }

            .profile-status--inactive::before {
                background: #dc2626;
            }

            .profile-status--inactive {
                color: #b91c1c;
            }

            .profile-timeline {
                padding: .55rem 1.5rem 1.15rem;
            }

            .profile-timeline-item {
                position: relative;
                display: grid;
                grid-template-columns: 24px minmax(0, 1fr);
                gap: .8rem;
                min-height: 92px;
                padding: 1rem 0;
            }

            .profile-timeline-item:not(:last-child)::before {
                position: absolute;
                top: 34px;
                bottom: -4px;
                left: 11px;
                width: 1px;
                background: linear-gradient(#e9cbd2, #f1e9eb);
                content: "";
            }

            .profile-timeline-marker {
                position: relative;
                z-index: 1;
                display: grid;
                width: 24px;
                height: 24px;
                place-items: center;
                border: 1px solid #f1d9df;
                border-radius: 50%;
                background: #fff;
                color: #800020;
                font-size: .7rem;
            }

            .profile-timeline-item:last-child .profile-timeline-marker {
                border-color: #eadcb5;
                background: #fffaf0;
                color: #a66b08;
            }

            .profile-timeline-label {
                display: block;
                margin: .05rem 0 .45rem;
                color: #64748b;
                font-size: .75rem;
                font-weight: 700;
                letter-spacing: .05em;
                text-transform: uppercase;
            }

            .profile-timeline-date {
                display: block;
                color: #172033;
                font-size: .92rem;
                font-weight: 650;
                overflow-wrap: anywhere;
            }

            @media (max-width: 760px) {
                .profile-panels {
                    grid-template-columns: 1fr;
                }
            }

            @media (max-width: 560px) {
                .profile-page {
                    padding: 1.1rem;
                }

                .profile-heading {
                    gap: .8rem;
                    margin-bottom: 1.25rem;
                }

                .profile-heading-icon {
                    flex-basis: 44px;
                    width: 44px;
                    height: 44px;
                    border-radius: 14px;
                }

                .profile-summary {
                    align-items: stretch;
                    flex-direction: column;
                    gap: 1.1rem;
                    padding: 1.3rem;
                }

                .profile-identity {
                    align-items: flex-start;
                    gap: .9rem;
                }

                .profile-avatar {
                    flex-basis: 58px;
                    width: 58px;
                    height: 58px;
                    border-radius: 19px;
                    font-size: 1.4rem;
                }

                .profile-hero-meta {
                    align-self: flex-start;
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                    width: 100%;
                }

                .profile-meta-item {
                    min-width: 0;
                    padding: .7rem;
                    font-size: .8rem;
                }

                .profile-meta-item--identifier {
                    grid-column: 1 / -1;
                }

                .profile-section-heading {
                    padding: 1.1rem;
                }

                .profile-item {
                    padding: .95rem .25rem;
                }

                .profile-timeline {
                    padding-right: 1.1rem;
                    padding-left: 1.1rem;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .profile-panel,
                .profile-item {
                    transition: none;
                }

                .profile-panel:hover {
                    transform: none;
                }
            }
        </style>

        <main class="profile-page">
            <header class="profile-heading">
                <span class="profile-heading-icon" aria-hidden="true">
                    <i class="pi pi-user" />
                </span>
                <div>
                    <h1>#{msg.profile}</h1>
                    <p>#{msg.profileDescription}</p>
                </div>
            </header>

            <section class="profile-summary" aria-label="#{msg.profile}">
                <div class="profile-identity">
                    <div class="profile-avatar" aria-hidden="true">
                        <h:outputText value="#{sessionBean.loggedUser.email.substring(0, 1)}" />
                    </div>
                    <div>
                        <span class="profile-eyebrow">#{msg.profileOverview}</span>
                        <h2><h:outputText value="#{sessionBean.loggedUser.email}" /></h2>
                        <span class="profile-role">
                            <i class="pi pi-shield" aria-hidden="true"></i>
                            <h:outputText value="#{msg[sessionBean.loggedUser.perfil.toString()]}" />
                        </span>
                    </div>
                </div>
                <div class="profile-hero-meta">
                    <div class="profile-meta-item #{sessionBean.loggedUser.active ? '' : 'profile-meta-item--inactive'}">
                        <i class="pi #{sessionBean.loggedUser.active ? 'pi-check-circle' : 'pi-times-circle'}" aria-hidden="true"></i>
                        <h:outputText value="#{sessionBean.loggedUser.active ? msg.active : msg.inactive}" />
                    </div>
                    <div class="profile-meta-item profile-meta-item--identifier">
                        <i class="pi pi-hashtag" aria-hidden="true"></i>
                        <span>#{msg.accountIdentifier}: <h:outputText value="#{sessionBean.loggedUser.pkUser}" /></span>
                    </div>
                </div>
            </section>

            <div class="profile-panels">
                <section class="profile-panel" aria-labelledby="profile-details-title">
                    <div class="profile-section-heading">
                        <span class="profile-section-icon" aria-hidden="true">
                            <i class="pi pi-id-card" />
                        </span>
                        <div>
                            <h2 id="profile-details-title">#{msg.accountDetails}</h2>
                        </div>
                    </div>
                    <div class="profile-grid">
                        <div class="profile-item">
                            <span class="profile-item-icon" aria-hidden="true"><i class="pi pi-envelope" /></span>
                            <div class="profile-item-content">
                                <span class="profile-item-label">#{msg.email}</span>
                                <span class="profile-item-value"><h:outputText value="#{sessionBean.loggedUser.email}" /></span>
                            </div>
                        </div>
                        <div class="profile-item">
                            <span class="profile-item-icon" aria-hidden="true"><i class="pi pi-shield" /></span>
                            <div class="profile-item-content">
                                <span class="profile-item-label">#{msg.profile}</span>
                                <span class="profile-item-value"><h:outputText value="#{msg[sessionBean.loggedUser.perfil.toString()]}" /></span>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="profile-panel" aria-labelledby="profile-history-title">
                    <div class="profile-section-heading">
                        <span class="profile-section-icon" aria-hidden="true">
                            <i class="pi pi-history" />
                        </span>
                        <div>
                            <h2 id="profile-history-title">#{msg.accountActivity}</h2>
                            <p>#{msg.accountActivityDescription}</p>
                        </div>
                    </div>
                    <div class="profile-timeline">
                        <div class="profile-timeline-item">
                            <span class="profile-timeline-marker" aria-hidden="true"><i class="pi pi-plus" /></span>
                            <div>
                                <span class="profile-timeline-label">#{msg.accountCreatedAt}</span>
                                <span class="profile-timeline-date">
                                    <h:outputText value="#{sessionBean.loggedUser.userCreationDate}">
                                        <f:convertDateTime type="localDateTime" pattern="dd/MM/yyyy HH:mm" />
                                    </h:outputText>
                                </span>
                            </div>
                        </div>
                        <div class="profile-timeline-item">
                            <span class="profile-timeline-marker" aria-hidden="true"><i class="pi pi-refresh" /></span>
                            <div>
                                <span class="profile-timeline-label">#{msg.accountUpdatedAt}</span>
                                <span class="profile-timeline-date">
                                <h:outputText value="#{sessionBean.loggedUser.userModificationDate}">
                                    <f:convertDateTime type="localDateTime" pattern="dd/MM/yyyy HH:mm" />
                                </h:outputText>
                                </span>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </ui:define>
</ui:composition>
