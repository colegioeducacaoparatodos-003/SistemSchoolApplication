<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <f:facet name="first">
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </f:facet>
    
    <title>Login | Gestão Escolar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    
    <style type="text/css">
        :root {
            --enr-black: #141414;
            --enr-red: #c8102e;
            --enr-yellow: #f5b400;
            --enr-surface: #ffffff;
            --enr-border: #e6e6e8;
            --enr-text: #141414;
            --enr-muted: #666a70;
        }

        .sc-loading-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: opacity 0.35s ease, visibility 0.35s ease;
        }
        .sc-loading-overlay.active { opacity: 1; visibility: visible; }
        .sc-loading-box {
            background: var(--enr-surface); border-radius: 12px; padding: 2.5rem 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4); display: flex; flex-direction: column;
            align-items: center; gap: 1.2rem; border: 1px solid var(--enr-border); min-width: 260px;
            transform: scale(0.9); transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .sc-loading-overlay.active .sc-loading-box { transform: scale(1); }
        .sc-loader-rings { position: relative; width: 72px; height: 72px; }
        .sc-loader-rings::before, .sc-loader-rings::after {
            content: ''; position: absolute; border-radius: 50%; border: 3px solid transparent;
        }
        .sc-loader-rings::before {
            top: 0; left: 0; width: 100%; height: 100%;
            border-top-color: var(--enr-red); border-right-color: var(--enr-yellow);
            animation: scSpin 1.2s linear infinite;
        }
        .sc-loader-rings::after {
            top: 10px; left: 10px; width: calc(100% - 20px); height: calc(100% - 20px);
            border-bottom-color: var(--enr-black); border-left-color: #e63946;
            animation: scSpinReverse 0.9s linear infinite;
        }
        .sc-loader-core {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 16px; height: 16px;
            background: linear-gradient(135deg, var(--enr-red), var(--enr-yellow));
            border-radius: 50%; animation: scPulse 1s ease-in-out infinite;
            box-shadow: 0 0 15px rgba(200, 16, 46, 0.5);
        }
        @keyframes scSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes scSpinReverse { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
        @keyframes scPulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 50% { transform: translate(-50%, -50%) scale(1.4); opacity: 0.7; } }
        .sc-loading-text { font-family: 'DM Sans', system-ui, sans-serif; font-size: 1rem; font-weight: 600; color: var(--enr-text); text-align: center; }
        .sc-loading-sub { font-size: 0.78rem; color: var(--enr-muted); text-align: center; margin-top: -0.6rem; }
        .sc-loading-dots::after { content: ''; animation: scDots 1.5s steps(4, end) infinite; }
        @keyframes scDots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } 100% { content: ''; } }
        .sc-loading-progress { width: 100%; height: 3px; background: var(--enr-border); border-radius: 99px; overflow: hidden; margin-top: 0.3rem; }
        .sc-loading-progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--enr-red), var(--enr-yellow)); border-radius: 99px; animation: scProgress 2s ease-in-out infinite; }
        @keyframes scProgress { 0% { width: 0%; margin-left: 0%; } 50% { width: 60%; margin-left: 20%; } 100% { width: 0%; margin-left: 100%; } }

        @media (max-width: 576px) {
            .sc-loading-box { padding: 2rem 1.5rem; min-width: 220px; margin: 0 1rem; }
        }
    </style>
</h:head>

<h:body class="bg-light">
    
    <div id="scLoadingOverlay" class="sc-loading-overlay">
        <div class="sc-loading-box">
            <div class="sc-loader-rings"><div class="sc-loader-core"></div></div>
            <div class="sc-loading-text">A processar<span class="sc-loading-dots"></span></div>
            <div class="sc-loading-sub">Por favor aguarde</div>
            <div class="sc-loading-progress"><div class="sc-loading-progress-bar"></div></div>
        </div>
    </div>

    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="card shadow-sm" style="max-width: 420px; width: 100%;">
            <div class="card-body p-4">

                <div class="text-center mb-4">
                    <h1 class="h4 mb-1">Gestão Escolar</h1>
                    <p class="text-muted small mb-0">Portal administrativo e pedagógico</p>
                </div>

                <p:messages id="messages" showDetail="true" showSummary="true" closable="true" />

                <h:form id="loginForm">
                    <div class="mb-3">
                        <h:outputLabel for="email" value="Email" styleClass="form-label" />
                        <p:inputText id="email" value="#{userController.loginEmail}"
                            placeholder="seu.email@escola.co.ao" required="true" requiredMessage="Email é obrigatório"
                            style="width: 100%;" />
                    </div>

                    <div class="mb-3">
                        <h:outputLabel for="password" value="Palavra-passe" styleClass="form-label" />
                        <p:password id="password" value="#{userController.loginPassword}" feedback="false"
                            required="true" requiredMessage="Senha é obrigatória" style="width: 100%;" />
                    </div>

                    <div class="mb-3 d-flex align-items-center gap-2">
                        <p:selectBooleanCheckbox id="remember" value="#{userController.rememberMe}" />
                        <h:outputLabel for="remember" value="Lembrar-me" />
                    </div>

                    <p:commandButton value="Entrar" action="#{userController.login}" update=":messages"
                        style="width: 100%;"
                        onstart="showScLoading()"
                        oncomplete="hideScLoading()"
                        onerror="hideScLoading()" />
                </h:form>

                <!-- LINK "CRIAR CONTA" — SÓ APARECE QUANDO NÃO EXISTE ADMIN -->
                <!-- CORREÇÃO: h:outputLink com value direto em vez de h:link outcome -->
                <h:panelGroup rendered="#{userController.firstAdminSetup}">
                    <p class="text-center small text-muted mt-3 mb-0">
                        Ainda não tem conta?
                        <h:outputLink value="#{request.contextPath}/components/dashboard/sign_in.xhtml" styleClass="text-decoration-none fw-semibold">
                            Criar conta
                        </h:outputLink>
                    </p>
                </h:panelGroup>

            </div>
        </div>
    </div>

    <script type="text/javascript">
        //<![CDATA[
        function showScLoading() {
            var overlay = document.getElementById('scLoadingOverlay');
            if (overlay) overlay.classList.add('active');
        }
        function hideScLoading() {
            var overlay = document.getElementById('scLoadingOverlay');
            if (overlay) overlay.classList.remove('active');
        }
        if (window.PrimeFaces) {
            PrimeFaces.ajax.Queue.originalAdd = PrimeFaces.ajax.Queue.add;
            PrimeFaces.ajax.Queue.add = function (req) {
                req.originalOncomplete = req.onsuccess;
                req.onsuccess = function (xhr, status, args) {
                    hideScLoading();
                    if (req.originalOncomplete) req.originalOncomplete(xhr, status, args);
                };
                req.originalOnerror = req.onerror;
                req.onerror = function (xhr, status, error) {
                    hideScLoading();
                    if (req.originalOnerror) req.originalOnerror(xhr, status, error);
                };
                PrimeFaces.ajax.Queue.originalAdd(req);
            };
        }
        //]]>
    </script>
</h:body>

</html>
