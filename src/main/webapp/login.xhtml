<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <f:facet name="first">
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </f:facet>
    
    <title>Login | Gestão Escolar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</h:head>

<h:body class="bg-light">
    
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="card shadow-sm" style="max-width: 420px; width: 100%;">
            <div class="card-body p-4">

                <div class="text-center mb-4">
                    <h1 class="h4 mb-1">Gestão Escolar</h1>
                    <p class="text-muted small mb-0">Portal administrativo e pedagógico</p>
                </div>

                <p:messages id="messages" showDetail="true" showSummary="true" closable="true" />

                <h:form id="loginForm">
                    <div class="mb-3">
                        <h:outputLabel for="email" value="Email" styleClass="form-label" />
                        <p:inputText id="email" value="#{userController.loginEmail}"
                            placeholder="seu.email@escola.co.ao" required="true" requiredMessage="Email é obrigatório"
                            style="width: 100%;" />
                    </div>

                    <div class="mb-3">
                        <h:outputLabel for="password" value="Palavra-passe" styleClass="form-label" />
                        <p:password id="password" value="#{userController.loginPassword}" feedback="false"
                            required="true" requiredMessage="Senha é obrigatória" style="width: 100%;" />
                    </div>

                    <div class="mb-3 d-flex align-items-center gap-2">
                        <p:selectBooleanCheckbox id="remember" value="#{userController.rememberMe}" />
                        <h:outputLabel for="remember" value="Lembrar-me" />
                    </div>

                    <p:commandButton value="Entrar" action="#{userController.login}" update=":messages"
                        style="width: 100%;" />
                </h:form>

                <p class="text-center small text-muted mt-3 mb-0">
                    Ainda não tem conta?
                    <h:link outcome="/components/dashboard/sign_in.xhtml" value="Criar conta"
                            styleClass="text-decoration-none fw-semibold" />
                </p>

            </div>
        </div>
    </div>
</h:body>

</html>
