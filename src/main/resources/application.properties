############################################################
# APPLICATION
############################################################
spring.application.name=SistemSchool
server.port=8080
spring.main.allow-bean-definition-overriding=true
    
# JSF Configuration
jakarta.faces.STATE_SAVING_METHOD=server
jakarta.faces.PARTIAL_STATE_SAVING=true
jakarta.faces.ENABLE_CDI_RESOLVER=true
jakarta.faces.PROJECT_STAGE=Development

# PrimeFaces Configuration 
spring.servlet.multipart.enabled=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.location=${java.io.tmpdir}

# PrimeFaces Settings
primefaces.UPLOADER=commons
primefaces.UPLOAD_MAX_FILE_SIZE=10485760 # 10MB
primefaces.SUBMIT=partial
primefaces.PRIVATE_CAPTCHA_KEY=false
primefaces.UPLOAD_MAX_FILES=10
    
# PrimeFaces Theme and Font Awesome
primefaces.THEME=saga
primefaces.FONT_AWESOME=true

# View Resolver Configuration
#spring.web.resources.add-mappings=true
spring.mvc.view.suffix=.xhtml
spring.mvc.view.prefix=/WEB-INF/views/
#spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.ddl-auto=update

# Database Configuration
spring.datasource.url = jdbc:mysql://localhost:3306/defaultdb
spring.datasource.username : root
spring.datasource.password = 
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect.version=8.0

#security
server.servlet.session.timeout=59m
spring.jpa.open-in-view=false

